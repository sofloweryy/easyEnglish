<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Easy English</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">

<style>
:root{
    --paper:#FFF9F0;
    --ink:#403C3A;
    --blue:#8CAFFF;
    --pink:#F3A9BF;
    --yellow:#FFE5A6;
    --gray:#8E8986;
}

*{
    box-sizing:border-box;
}

body{
    margin:0;
    background:#FFF9F0;
    font-family:"Quicksand","Microsoft YaHei",sans-serif;
    color:var(--ink);
}


/* 页面 */
.app{
    max-width:430px;
    margin:auto;
    min-height:100vh;
    padding:25px 22px;
}


/* 顶部 */
.header{
    display:flex;
    justify-content:space-between;
    align-items:center;
}


.logo{
    font-size:42px;
    font-weight:700;
    letter-spacing:-1px;
}

.logo .blue{
    color:var(--blue);
}


.logo:after{
    content:"✦";
    color:var(--pink);
    font-size:28px;
}


.status{
    background:#fff;
    border:2px solid var(--ink);
    border-radius:20px;
    padding:10px 16px;
    font-size:14px;
    line-height:22px;
    box-shadow:3px 4px 0 var(--ink);
}


/* 主卡片 */

.study-card{

    margin-top:35px;

    background:#fff;

    border:2px solid var(--ink);

    border-radius:32px;

    padding:25px;

    position:relative;

    box-shadow:5px 6px 0 var(--ink);

}


/* 胶带 */

.study-card:before{

    content:"";

    position:absolute;

    top:-15px;

    left:45px;

    width:90px;

    height:25px;

    background:var(--yellow);

    transform:rotate(-5deg);

    opacity:.8;

}


/* 欢迎语 */

.subtitle{

    text-align:center;

    color:#999;

    font-size:16px;

    margin-bottom:22px;

}



/* tabs */

.tabs{

    display:flex;

    border:2px solid var(--ink);

    border-radius:18px;

    overflow:hidden;

    margin-bottom:35px;

}


.tab{

    flex:1;

    border:0;

    background:#FFF;

    padding:13px;

    font-size:16px;

    font-weight:bold;

    color:#999;

}


.tab.active{

    background:#EEF4FF;

    color:#668FEA;

}



/* 单词区域 */

.word-area{

    text-align:center;

}


.tag{

    color:var(--pink);

    font-size:15px;

}


.word{

    margin:15px 0;

    font-size:52px;

    color:var(--blue);

    font-weight:bold;

}


.meaning{

    font-family:"ZCOOL KuaiLe";

    font-size:30px;

}


.hint{

    margin-top:12px;

    color:#999;

    font-size:18px;

}


/* 输入 */

.input-wrap{

    margin-top:30px;

    position:relative;

}


textarea{

    width:100%;

    height:100px;

    border:2px solid var(--ink);

    border-radius:22px;

    padding:18px;

    font-size:18px;

    resize:none;

    outline:none;

}


textarea::placeholder{

    color:#AAA;

}



.voice{

    position:absolute;

    right:15px;

    bottom:15px;

    width:42px;

    height:42px;

    border-radius:50%;

    background:#FFEAF1;

    border:2px solid var(--ink);

}



/* 按钮 */

.actions{

    display:flex;

    gap:12px;

    margin-top:22px;

}


.btn{

    border:2px solid var(--ink);

    border-radius:20px;

    padding:14px;

    font-size:16px;

    font-weight:bold;

    box-shadow:3px 4px 0 var(--ink);

}


.submit{

    flex:1;

    background:#F7B0C6;

}


.next{

    background:#FFF1C9;

}


.answer{

    background:#EEF4FF;

}


/* 底部 */

.bottom{

    margin-top:25px;

    background:white;

    border:2px solid var(--ink);

    border-radius:25px;

    padding:18px;

    display:flex;

    justify-content:space-between;

    box-shadow:3px 4px 0 var(--ink);

}



.result{

    margin-top:15px;

    min-height:30px;

    text-align:center;

}


</style>

</head>


<body>

<div class="app">


<div class="header">


<div class="logo">
Easy <span class="blue">English</span>
</div>


<div class="status">
🔥 连续1天<br>
⭐ 10分
</div>


</div>




<div class="study-card">


<div class="subtitle">
今天也学习一点点英语吧 ♡
</div>


<div class="tabs">

<button class="tab active">
🔤 高频单词
</button>


<button class="tab">
💬 常用短语
</button>


</div>




<div class="word-area">


<div class="tag">
Today's Word
</div>


<div class="word">
strategy
</div>


<div class="meaning">
策略、战略
</div>


<div class="hint">
Hint: s _ _ _ _ _ y
</div>



</div>




<div class="input-wrap">


<textarea placeholder="请在此输入英文..."></textarea>


<button class="voice">
🎤
</button>


</div>




<div class="actions">


<button class="btn submit">
✍️ 提交答案
</button>


<button class="btn next">
🍃 换题
</button>


<button class="btn answer">
👀
</button>


</div>


<div class="result"></div>



</div>



<div class="bottom">

<span>
✨ 点击有惊喜
</span>


<span>
👤 flower
</span>


</div>



</div>


</body>
</html>
