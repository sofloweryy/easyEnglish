<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Easy English</title>
<!-- 引入 Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#FFF9F0;
font-family:"PingFang SC","Microsoft YaHei",sans-serif;
color:#403C3A
}
.app{
max-width:430px;
margin:auto;
padding:24px
}
.header{
display:flex;
justify-content:space-between;
align-items:center
}
.logo{
font-size:34px;
font-weight:900
}
.logo span{
color:#8CAFFF
}
.status{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:10px;
font-size:13px;
box-shadow:3px 3px 0 #403C3A
}
.install{
margin-top:8px;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px;
font-size:13px;
text-align:center;
cursor:pointer
}
.card{
margin-top:25px;
background:#fff;
border:2px solid #403C3A;
border-radius:30px;
padding:25px;
box-shadow:5px 5px 0 #403C3A
}
.title{
text-align:center;
color:#777;
margin-bottom:20px
}
.tabs{
display:flex;
border:2px solid #403C3A;
border-radius:18px;
overflow:hidden
}
.tabs button{
flex:1;
padding:12px;
border:0;
background:#fff;
font-weight:bold;
cursor:pointer
}
.tabs .active{
background:#EEF4FF;
color:#668FEA
}
.category{
margin:20px auto;
width:max-content;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px 14px;
font-size:13px
}
.question{
text-align:center;
font-size:24px;
font-weight:bold;
color:#8CAFFF;
margin:25px 0 10px;
line-height: 1.4;
}
.synonyms{
text-align:center;
font-size:13px;
color:#999;
margin-bottom:25px
}
.input-wrap{
position:relative
}
textarea{
width:100%;
height:90px;
border:2px solid #403C3A;
border-radius:20px;
padding:15px;
font-size:16px;
outline:none;
resize:none
}
.voice-btn{
position:absolute;
right:12px;
bottom:15px;
background:none;
border:0;
font-size:22px;
cursor:pointer;
padding:4px;
border-radius:10px;
transition:transform 0.1s
}
.voice-btn:active{
transform:scale(0.9)
}
.buttons{
display:flex;
gap:10px;
margin-top:15px
}
.buttons button{
flex:1;
padding:12px;
border-radius:18px;
border:2px solid #403C3A;
font-weight:bold;
box-shadow:3px 3px 0 #403C3A;
cursor:pointer
}
.submit{background:#F3A9BF}
.next{background:#FFE5A6}
.answer{background:#EEF4FF}
.result{
display:none;
margin-top:20px;
background:#EAF6EA;
padding:15px;
border-radius:18px;
text-align:center
}
.audio{
border:0;
background:none;
font-size:18px;
cursor:pointer
}
footer{
margin-top:25px;
display:flex;
justify-content:space-between
}
footer button{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:12px;
cursor:pointer
}
.surprise{
background:#FFF1C9
}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
justify-content:center;
align-items:center;
z-index:999
}
.modal-box{
width:85%;
background:#FFF9F0;
border:2px solid #403C3A;
border-radius:28px;
padding:30px;
text-align:center
}
.wechat{
color:#07C160;
font-size:22px;
font-weight:bold
}
.modal-box button{
width:100%;
padding:14px;
border-radius:18px;
border:2px solid #403C3A;
background:#F3A9BF;
cursor:pointer;
margin-top:15px
}
.modal-box input {
width:100%;
padding:10px 12px;
margin-top:8px;
border:2px solid #403C3A;
border-radius:12px;
font-size:15px;
outline:none;
background:#FFF;
text-align:left;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">Easy <span>English</span></div>
<div>
<div class="status">🔥 连续打卡<br>⭐120</div>
<div class="install" onclick="openAppPop()">📲 下载App</div>
</div>
</div>


<div class="card">

<div class="title">
每天3分钟，让英语偷偷长出来 🌱
</div>

<div class="tabs">
<button id="wordTab" class="active">🔤 单词库</button>
<button id="phraseTab">💬 短语库</button>
</div>

<div id="category" class="category">✨ 准备中</div>

<div id="question" class="question">正在把好玩的题目打包装箱... 🎁</div>

<div id="synonyms" class="synonyms"></div>

<div class="input-wrap">
<textarea id="input" placeholder="输入英文..."></textarea>
<button id="voiceBtn" class="voice-btn" title="长按说英文">🎤</button>
</div>

<div class="buttons">
<button class="submit" onclick="check()">✍️提交</button>
<button class="next" onclick="next()">🍃换题</button>
<button class="answer" onclick="answer()">👀答案</button>
</div>

<div id="result" class="result"></div>

</div>


<footer>
<button class="surprise" onclick="openPop()">✨ 点击有惊喜</button>
<button onclick="openMyPop()" id="myBtn">👤 flower</button>
</footer>

</div>


<div id="modal" class="modal">
<div class="modal-box">
<p>👀 偷偷认识美丽且智慧的开发者</p>
<p>她正在努力让英语有趣一点儿 🤣</p>
<p>
🌱 微信：
<br>
<span class="wechat">vildbloom</span>
</p>
<button onclick="closePop()">我倒是要看看</button>
</div>
</div>

<div id="appModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">📲 添加到手机桌面</p>
<p style="font-size: 14px; line-height: 1.6; color: #555;">
• <b>iOS (Safari 浏览器)</b>：<br>点击下方工具栏的“分享”按钮，然后选择 <b>“添加到主屏幕”</b>。<br><br>
• <b>Android (Chrome 浏览器)</b>：<br>点击右上角菜单按钮，选择 <b>“安装应用”</b> 或 <b>“添加到主屏幕”</b>。
</p>
<button onclick="closeAppPop()" style="margin-top: 10px;">我知道啦</button>
</div>
</div>

<div id="myModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">👤 个人中心绑定</p>
<label style="font-size: 13px; font-weight: bold;">专属昵称：</label>
<input type="text" id="regName" placeholder="例如：flower">
<label style="font-size: 13px; font-weight: bold; display: block; margin-top: 10px;">绑定邮箱：</label>
<input type="email" id="regEmail" placeholder="your_email@domain.com">
<button id="sendEmailBtn" onclick="sendSignInEmail()" style="background:#F3A9BF;">发送邮件并绑定</button>
<button onclick="closeMyPop()" style="background:#FFE5A6; margin-top: 8px;">关闭</button>
</div>
</div>


<script>

// 初始化 Supabase 客户端
const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
const supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.onload = function() {
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName){
        document.getElementById('myBtn').innerText = `👤 ${savedName}`;
    }
    initQuestionPool();
}

let type = "word"; // 'word' 或 'phrase'
let questionPool = []; 
let current = null;

async function initQuestionPool() {
    document.getElementById('category').innerHTML = "✨ 准备中";
    document.getElementById('question').innerHTML = "正在把好玩的题目打包装箱... 🎁";
    
    try {
        const { data, error } = await supabaseApp
            .from('questions')
            .select('*')
            .eq('type', type);

        if (error) throw error;

        questionPool = data || [];
        
        if (questionPool.length === 0) {
            document.getElementById('category').innerHTML = "💡 提示";
            document.getElementById('question').innerHTML = "题库正在赶来的路上，请稍候... 🌱";
            return;
        }

        next();
    } catch (err) {
        console.error(err);
        document.getElementById('category').innerHTML = "⚠️ 网络开小差了";
        document.getElementById('question').innerHTML = "刷新一下页面重新连接试试看 🍃";
    }
}

// 核心升级：基于 LocalStorage 记录已做过的题目 ID，确保整轮 100% 不重复！
function next(){
    if (questionPool.length === 0) return;

    let historyKey = `ee_done_ids_${type}`;
    let doneIds = [];
    try {
        doneIds = JSON.parse(localStorage.getItem(historyKey)) || [];
    } catch(e) {
        doneIds = [];
    }

    // 筛选出还没做过的题目
    let available = questionPool.filter(q => !doneIds.includes(q.id));

    // 如果全部做完了，给个温馨提示并清空历史重新开始新一轮循环
    if (available.length === 0) {
        localStorage.removeItem(historyKey);
        available = questionPool;
        // 可以加句提示或者直接进入下一轮
    }

    // 在剩余没做过的题目里随机抽一个
    let randomIndex = Math.floor(Math.random() * available.length);
    current = available[randomIndex];

    // 把当前题目 ID 记入已做历史
    doneIds.push(current.id);
    localStorage.setItem(historyKey, JSON.stringify(doneIds));

    render();
}

function render(){
    if (!current) return;
    document.getElementById('category').innerHTML = current.category;
    document.getElementById('question').innerHTML = current.question;
    
    let synHtml = "";
    if (type === "word" && current.synonyms && current.synonyms.length > 0) {
        synHtml = "近义词：" + current.synonyms.join(" · ");
    }
    document.getElementById('synonyms').innerHTML = synHtml;
    document.getElementById('input').value = "";
    document.getElementById('result').style.display = "none";
}

const wordTab = document.getElementById('wordTab');
const phraseTab = document.getElementById('phraseTab');

wordTab.onclick = async () => {
    if(type === "word") return;
    type = "word";
    wordTab.classList.add("active");
    phraseTab.classList.remove("active");
    await initQuestionPool();
}

phraseTab.onclick = async () => {
    if(type === "phrase") return;
    type = "phrase";
    phraseTab.classList.add("active");
    wordTab.classList.remove("active");
    await initQuestionPool();
}

function answer(){
    let result = document.getElementById('result');
    result.style.display = "block";
    if(type === "word"){
        result.innerHTML = `<b>${current.answer}</b> &nbsp; ${current.phonetic || ""} <button class="audio" onclick="speak('${current.answer}')">🔊</button>`;
    } else {
        result.innerHTML = `<b>${current.answer}</b>`;
    }
}

function check(){
    let v = document.getElementById('input').value.trim();
    let result = document.getElementById('result');
    result.style.display = "block";
    if(!v){
        result.innerHTML = "⚠️ 请先输入答案或使用长按语音输入";
        return;
    }
    let lv = v.toLowerCase();
    result.innerHTML = current.answer.toLowerCase().includes(lv) ? "✨ Nice！" : "💡 再试试看";
}

function speak(t){
    let u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
}

function openPop(){ modal.style.display = "flex"; }
function closePop(){ modal.style.display = "none"; }
function openAppPop(){ document.getElementById('appModal').style.display = "flex"; }
function closeAppPop(){ document.getElementById('appModal').style.display = "none"; }
function openMyPop(){
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) document.getElementById('regName').value = savedName;
    const savedEmail = localStorage.getItem('ee_email');
    if(savedEmail) document.getElementById('regEmail').value = savedEmail;
    document.getElementById('myModal').style.display = "flex";
}
function closeMyPop(){ document.getElementById('myModal').style.display = "none"; }

async function sendSignInEmail(){
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const btn = document.getElementById('sendEmailBtn');

    if(!name || !email){
        alert("⚠️ 请填写完整的昵称和邮箱！");
        return;
    }

    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
        const { error } = await supabaseApp.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: window.location.origin }
        });

        if(error) throw error;

        localStorage.setItem('ee_nickname', name);
        localStorage.setItem('ee_email', email);
        document.getElementById('myBtn').innerText = `👤 ${name}`;

        alert("✨ 验证邮件已发送！请前往您的邮箱查收，并点击邮件中的 Sign In 链接完成绑定。");
        closeMyPop();
    } catch (err) {
        alert("❌ 发送失败：" + (err.message || "请检查邮箱或网络配置"));
    } finally {
        btn.disabled = false;
        btn.innerText = "发送邮件并绑定";
    }
}

const voiceBtn = document.getElementById('voiceBtn');
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onresult = function(e){
        document.getElementById('input').value = e.results[0][0].transcript;
    };
}

let isRecording = false;
const startVoice = (e) => {
    e.preventDefault();
    if(!recognition){
        alert("当前浏览器暂不支持语音识别功能");
        return;
    }
    if(isRecording) return;
    isRecording = true;
    voiceBtn.style.transform = "scale(0.85)";
    try{ recognition.start(); }catch(err){}
};

const stopVoice = (e) => {
    e.preventDefault();
    if(!isRecording) return;
    isRecording = false;
    voiceBtn.style.transform = "scale(1)";
    try{ recognition.stop(); }catch(err){}
};

voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', stopVoice);
voiceBtn.addEventListener('mouseleave', stopVoice);
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', stopVoice);

</script>

</body>
</html>
