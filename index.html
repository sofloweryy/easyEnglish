<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy English</title>
    <style>
        body {
            background-color: #fcf9f2;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        /* 顶部打卡与下载App */
        .top-header {
            width: 440px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-bottom: 15px;
            box-sizing: border-box;
            padding: 0 10px;
        }
        .badge-card {
            background: #ffffff;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 6px 12px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #222;
            text-align: left;
        }
        .app-btn {
            background: #fde68a;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 6px 14px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #222;
            cursor: pointer;
            text-decoration: none;
            color: #222;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 主面板 */
        .container {
            width: 440px;
            background: #ffffff;
            border: 2px solid #222;
            border-radius: 24px;
            padding: 24px;
            box-shadow: 5px 5px 0px #222;
            text-align: center;
            box-sizing: border-box;
        }

        .slogan {
            font-size: 15px;
            color: #444;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* 单词库 / 短语库 切换栏 */
        .tabs {
            display: flex;
            background: #ffffff;
            border-radius: 30px;
            padding: 3px;
            margin-bottom: 20px;
            border: 2px solid #222;
            position: relative;
        }
        .tab {
            flex: 1;
            padding: 10px;
            border-radius: 24px;
            border: none;
            background: transparent;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            color: #666;
            z-index: 1;
            transition: color 0.2s;
        }
        .tab.active {
            background: #e0f2fe;
            border: 2px solid #222;
            color: #1d4ed8;
            box-shadow: 2px 2px 0px #222;
        }

        /* 分类标签 */
        .category-tag {
            display: inline-block;
            background: #fef08a;
            border: 2px solid #222;
            padding: 4px 16px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px #222;
        }

        /* 题目中文大字 */
        .question-title {
            font-size: 32px;
            font-weight: bold;
            color: #60a5fa;
            margin: 5px 0 8px 0;
        }

        /* 近义表达提示 */
        .alt-text {
            font-size: 14px;
            color: #777;
            margin-bottom: 20px;
            min-height: 20px;
        }

        /* 输入框区域 */
        .input-wrapper {
            position: relative;
            margin-bottom: 20px;
        }
        .input-box {
            width: 100%;
            height: 90px;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 14px;
            font-size: 16px;
            box-sizing: border-box;
            resize: none;
            outline: none;
            background: #fff;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.05);
        }
        .mic-icon {
            position: absolute;
            right: 14px;
            bottom: 16px;
            font-size: 18px;
            cursor: pointer;
        }

        /* 按钮组 */
        .btn-group {
            display: flex;
            gap: 12px;
            margin-bottom: 20px;
        }
        .action-btn {
            flex: 1;
            padding: 12px 0;
            border: 2px solid #222;
            border-radius: 16px;
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #222;
            transition: transform 0.1s, box-shadow 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
        }
        .action-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #222;
        }
        .btn-submit { background: #fbcfe8; }
        .btn-next { background: #fef08a; }
        .btn-answer { background: #e0f2fe; }

        /* 进度条 */
        .progress-container {
            width: 100%;
            background: #e5e7eb;
            height: 10px;
            border-radius: 5px;
            border: 2px solid #222;
            overflow: hidden;
            margin-bottom: 8px;
        }
        .progress-bar {
            width: 0%;
            height: 100%;
            background: #4ade80;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 13px;
            color: #666;
            font-weight: 600;
        }

        /* 底部双按钮 */
        .footer-actions {
            width: 440px;
            display: flex;
            gap: 12px;
            margin-top: 15px;
            box-sizing: border-box;
            padding: 0 10px;
        }
        .footer-btn {
            flex: 1;
            background: #ffffff;
            border: 2px solid #222;
            border-radius: 16px;
            padding: 10px;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 3px 3px 0px #222;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- 顶部打卡和下载App栏 -->
    <div class="top-header">
        <div class="badge-card">🔥 连续打卡 1 天<br>⭐ 0</div>
        <a href="#" class="app-btn">📱 下载App</a>
    </div>

    <!-- 主面板容器 -->
    <div class="container">
        <div class="slogan">每天3分钟，让英语偷偷长出来 🌱</div>

        <!-- 单词库 / 短语库 切换按钮 -->
        <div class="tabs">
            <button id="wordTab" class="tab active" onclick="switchTab('word')">🔤 单词库</button>
            <button id="phraseTab" class="tab" onclick="switchTab('phrase')">💬 短语库</button>
        </div>

        <!-- 题目分类标签 -->
        <div id="category" class="category-tag">基础单词</div>

        <!-- 中文题目大字 -->
        <div id="questionChinese" class="question-title">加载中...</div>

        <!-- 近义表达提示 -->
        <div id="altText" class="alt-text">近义表达：</div>

        <!-- 输入框与麦克风 -->
        <div class="input-wrapper">
            <textarea id="userInput" class="input-box" placeholder="输入英文..."></textarea>
            <span class="mic-icon">🎤</span>
        </div>

        <!-- 功能按钮组：提交、换题、答案 -->
        <div class="btn-group">
            <button class="action-btn btn-submit" onclick="checkAnswer()">✍️提交</button>
            <button class="action-btn btn-next" onclick="nextQuestion()">🌿换题</button>
            <button class="action-btn btn-answer" onclick="showAnswer()">👀答案</button>
        </div>

        <!-- 底部进度条 -->
        <div class="progress-container">
            <div id="progressBar" class="progress-bar"></div>
        </div>
        <div id="progressText" class="progress-text">本轮进度：0 / 0</div>
    </div>

    <!-- 页面最下方两个独立按钮 -->
    <div class="footer-actions">
        <button class="footer-btn">✨ 点击有惊喜</button>
        <button class="footer-btn">👤 flower</button>
    </div>

    <script>
        let currentType = 'word'; // 'word' 或 'phrase'
        let currentList = [];     
        let currentIndex = 0;     

        // 切换标签
        function switchTab(type) {
            currentType = type;
            document.getElementById('wordTab').classList.toggle('active', type === 'word');
            document.getElementById('phraseTab').classList.toggle('active', type === 'phrase');
            loadData();
        }

        // 独立读取对应的 JSON 文件
        function loadData() {
            const fileName = currentType === 'word' ? 'words.json' : 'phrases.json';
            
            fetch(fileName)
                .then(response => {
                    if (!response.ok) throw new Error("无法加载文件：" + fileName);
                    return response.json();
                })
                .then(data => {
                    currentList = data;
                    currentIndex = 0;
                    renderQuestion();
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById('questionChinese').innerText = "加载失败";
                    document.getElementById('altText').innerText = "请确保 " + fileName + " 已正确放置";
                });
        }

        // 渲染当前题目
        function renderQuestion() {
            if (!currentList || currentList.length === 0) return;
            const item = currentList[currentIndex];

            document.getElementById('category').innerText = item.category || '精选';
            document.getElementById('questionChinese').innerText = item.chinese; // 显示中文大字
            
            // 处理近义表达提示
            if (item.alternatives && item.alternatives.length > 0) {
                document.getElementById('altText').innerText = `近义表达：${item.alternatives.join(', ')}`;
            } else {
                document.getElementById('altText').innerText = `近义表达：暂无`;
            }

            document.getElementById('userInput').value = "";
            updateProgress();
        }

        // 更新进度条
        function updateProgress() {
            const total = currentList.length;
            const current = currentIndex;
            const percent = total > 0 ? (current / total) * 100 : 0;
            
            document.getElementById('progressBar').style.width = percent + '%';
            document.getElementById('progressText').innerText = `本轮进度：${current} / ${total}`;
        }

        // 换题
        function nextQuestion() {
            if (currentList.length === 0) return;
            currentIndex = (currentIndex + 1) % currentList.length; 
            renderQuestion();
        }

        // 提交检查
        function checkAnswer() {
            if (currentList.length === 0) return;
            const userVal = document.getElementById('userInput').value.trim().toLowerCase();
            const currentItem = currentList[currentIndex];
            const correctVal = currentItem.english.toLowerCase();
            
            let isCorrect = (userVal === correctVal);
            if (!isCorrect && currentItem.alternatives) {
                isCorrect = currentItem.alternatives.some(alt => alt.toLowerCase() === userVal);
            }

            if (isCorrect) {
                alert("回答正确！🎉");
                currentIndex = (currentIndex + 1) % currentList.length;
                renderQuestion();
            } else {
                alert("不对哦，再试一次！");
            }
        }

        // 查看答案（显示在近义表达位置或弹窗）
        function showAnswer() {
            if (currentList.length === 0) return;
            const currentItem = currentList[currentIndex];
            alert(`正确答案是: ${currentItem.english}`);
        }

        // 初始化加载
        loadData();
    </script>
</body>
</html>
