  {id:'P21',type:'phrase',category:'日常',question:'Would you like something to drink?',answer:'Yes, a cup of coffee please'},

// ========== 3. 全局变量 ==========
let type = "word"; // 'word' 或 'phrase'
let cloudPool = []; // Supabase 题库
let localPool = []; // 本地备用词库
let questionPool = []; // 合并后的完整题库
let current = null;
let isWrongBookMode = false; // 是否处于错题本模式

// ========== 4. 本地存储工具函数 ==========
function getDoneIds(type) {
    try {
        return JSON.parse(localStorage.getItem(`ee_done_${type}`)) || [];
    } catch(e) { return []; }
}
function saveDoneIds(type, ids) {
    localStorage.setItem(`ee_done_${type}`, JSON.stringify(ids));
}
function getWrongBookIds(type) {
    try {
        return JSON.parse(localStorage.getItem(`ee_wrong_${type}`)) || [];
    } catch(e) { return []; }
}
function addWrongId(type, id) {
    const ids = getWrongBookIds(type);
    if (!ids.includes(id)) {
        ids.push(id);
        saveWrongIds(type, ids);
    }
}
function saveWrongIds(type, ids) {
    localStorage.setItem(`ee_wrong_${type}`, JSON.stringify(ids));
}
function getStreak() {
    try {
        const s = JSON.parse(localStorage.getItem('ee_streak')) || { count: 0, lastDate: null };
        const today = new Date().toDateString();
        if (s.lastDate !== today) {
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            if (s.lastDate === yesterday) {
                s.count += 1;
            } else if (s.lastDate !== today) {
                s.count = 1;
            }
            s.lastDate = today;
            localStorage.setItem('ee_streak', JSON.stringify(s));
        }
        return s.count;
    } catch(e) { return 0; }
}
function addStar() {
    let stars = parseInt(localStorage.getItem('ee_stars') || '0');
    stars += 1;
    localStorage.setItem('ee_stars', String(stars));
    return stars;
}

function updateStats() {
    document.getElementById('streakInfo').innerHTML = `🔥 连续打卡 ${getStreak()} 天`;
    document.getElementById('starInfo').innerHTML = `⭐ ${localStorage.getItem('ee_stars') || '0'}`;
}

// ========== 5. 初始化 ==========
window.onload = function() {
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) {
        document.getElementById('myBtn').innerText = `👤 ${savedName}`;
    }
    updateStats();
    initQuestionPool();
}

// ========== 6. 核心：混合数据源初始化（解决题库少） ==========
async function initQuestionPool() {
    document.getElementById('category').innerHTML = "✨ 准备中";
    document.getElementById('question').innerHTML = "正在把好玩的题目打包装箱... 🎁";
    document.getElementById('modeTag').style.display = 'none';
    isWrongBookMode = false;

    // 1. 从 Supabase 获取云端数据
    try {
        const { data, error } = await supabaseApp
            .from('questions')
            .select('*')
            .eq('type', type);
        if (!error && data) {
            cloudPool = data;
        }
    } catch (err) {
        console.warn("Supabase 获取失败，将使用本地词库", err);
        cloudPool = [];
    }

    // 2. 从本地词库中筛选同类型的
    localPool = LOCAL_BACKUP_WORDS.filter(w => w.type === type);

    // 3. 合并题库：云端优先 + 本地兜底
    // 去重：如果云端和本地有相同 id，以云端为准
    const cloudIds = new Set((cloudPool || []).map(q => String(q.id)));
    const localOnly = localPool.filter(w => !cloudIds.has(String(w.id)));

    // 最终题库 = 云端数据 + 本地独有数据
    questionPool = [...(cloudPool || []), ...localOnly];

    if (questionPool.length === 0) {
        document.getElementById('category').innerHTML = "⚠️ 暂无题目";
        document.getElementById('question').innerHTML = "请检查网络连接或联系管理员添加题目 📮";
        return;
    }

    // 显示数据源信息
    const sourceInfo = [];
    if (cloudPool.length > 0) sourceInfo.push(`云端${cloudPool.length}题`);
    if (localOnly.length > 0) sourceInfo.push(`本地${localOnly.length}题`);
    document.getElementById('category').innerHTML = `📚 题库 (${sourceInfo.join(' + ')})`;

    next();
}

// ========== 7. 核心：智能抽题函数（解决重复刷题） ==========
function next(){
    if (questionPool.length === 0) return;

    const doneIds = getDoneIds(type);
    const wrongIds = getWrongBookIds(type);

    let available = [];

    if (isWrongBookMode) {
        // 错题本模式：只从错题中选
        available = questionPool.filter(q => wrongIds.includes(String(q.id)) && !doneIds.includes(String(q.id)));
    } else {
        // 普通模式：优先从未做过的题中选
        available = questionPool.filter(q => !doneIds.includes(String(q.id)));

        // 如果未做题没了，但错题本里有题，优先刷错题
        if (available.length === 0 && wrongIds.length > 0) {
            available = questionPool.filter(q => wrongIds.includes(String(q.id)));
            if (available.length > 0) {
                document.getElementById('modeTag').style.display = 'inline-block';
                document.getElementById('modeTag').innerText = '🔥 错题复习';
            }
        }
    }

    // 如果全部做完了，清空记录重新开始
    if (available.length === 0) {
        localStorage.removeItem(`ee_done_${type}`);
        available = [...questionPool];
        if (isWrongBookMode) {
            // 错题本空了，说明都学会了
            document.getElementById('modeTag').style.display = 'inline-block';
            document.getElementById('modeTag').innerText = '🎉 错题已清空';
            isWrongBookMode = false;
        }
    }

    // 随机抽题
    let randomIndex = Math.floor(Math.random() * available.length);
    current = available[randomIndex];

    // 渲染
    render();
    updateProgress();
}

// ========== 8. 渲染题目 ==========
function render(){
    if (!current) return;
    document.getElementById('category').innerHTML = current.category;
    document.getElementById('question').innerHTML = current.question;

    let synHtml = "";
    if (type === "word" && current.synonyms && current.synonyms.length > 0) {
        synHtml = "近义词：" + current.synonyms.join(" · ");
    }
    document.getElementById('synonyms').innerHTML = synHtml;
    document.getElementById('input').value = "";
    document.getElementById('result').style.display = "none";
    document.getElementById('result').className = "result";
}

// ========== 9. 提交答案（改进匹配逻辑 + 错题记录） ==========
function check(){
    let v = document.getElementById('input').value.trim();
    let result = document.getElementById('result');
    result.style.display = "block";

    if(!v){
        result.innerHTML = "⚠️ 请先输入答案或使用长按语音输入";
        result.className = "result result-wrong";
        return;
    }

    let lv = v.toLowerCase();
    let correct = false;

    // 改进的答案匹配：多答案支持 + 严格匹配
    let answers = Array.isArray(current.answer) ? current.answer : [current.answer];
    let answersLower = answers.map(a => a.toLowerCase().trim());

    // 1. 精确匹配
    if (answersLower.includes(lv)) {
        correct = true;
    }
    // 2. 去除标点/多余空格后匹配
    else {
        let cleanInput = lv.replace(/[^\w\s]/g, '').replace(/\s+/g, ' ');
        correct = answersLower.some(a => {
            let cleanAnswer = a.replace(/[^\w\s]/g, '').replace(/\s+/g, ' ');
            return cleanInput === cleanAnswer || cleanAnswer.includes(cleanInput) || cleanInput.includes(cleanAnswer);
        });
    }

    if (correct) {
        // 答对了
        addStar();
        updateStats();
        result.innerHTML = "✨ <b>Nice！</b> 回答正确！";
        result.className = "result result-correct";

        // 答对才标记为已完成（不再在显示时标记）
        const doneIds = getDoneIds(type);
        if (!doneIds.includes(String(current.id))) {
            doneIds.push(String(current.id));
            saveDoneIds(type, doneIds);
        }
        // 从错题本移除
        const wrongIds = getWrongBookIds(type);
        const wrongIdx = wrongIds.indexOf(String(current.id));
        if (wrongIdx > -1) {
            wrongIds.splice(wrongIdx, 1);
            saveWrongIds(type, wrongIds);
        }
    } else {
        // 答错了
        result.innerHTML = `💪 再试试看！正确答案是：<b>${current.answer}</b>`;
        result.className = "result result-wrong";

        // 答错加入错题本
        addWrongId(type, current.id);
    }

    updateProgress();
}

// ========== 10. 查看答案 ==========
function answer(){
    let result = document.getElementById('result');
    result.style.display = "block";
    if(type === "word"){
        result.innerHTML = `<b>${current.answer}</b> &nbsp; ${current.phonetic || ""} <button class="audio" onclick="speak('${current.answer}')">🔊</button>`;
    } else {
        result.innerHTML = `<b>${current.answer}</b>`;
    }
    result.className = "result";
}

// ========== 11. 进度更新 ==========
function updateProgress() {
    const doneIds = getDoneIds(type);
    const total = questionPool.length;
    const done = doneIds.length;
    document.getElementById('progressText').innerText = `${Math.min(done, total)} / ${total}`;
    document.getElementById('progressFill').style.width = `${(Math.min(done, total) / total * 100).toFixed(0)}%`;
}

// ========== 12. Tab 切换 ==========
const wordTab = document.getElementById('wordTab');
const phraseTab = document.getElementById('phraseTab');

wordTab.onclick = async () => {
    if(type === "word") return;
    type = "word";
    wordTab.classList.add("active");
    phraseTab.classList.remove("active");
    updateStats();
    await initQuestionPool();
}

phraseTab.onclick = async () => {
    if(type === "phrase") return;
    type = "phrase";
    phraseTab.classList.add("active");
    wordTab.classList.remove("active");
    updateStats();
    await initQuestionPool();
}

// ========== 13. 语音朗读 ==========
function speak(t){
    let u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
}

// ========== 14. 弹窗控制 ==========
function openPop(){ modal.style.display = "flex"; }
function closePop(){ modal.style.display = "none"; }
function openAppPop(){ document.getElementById('appModal').style.display = "flex"; }
function closeAppPop(){ document.getElementById('appModal').style.display = "none"; }
function openMyPop(){

    const savedEmail = localStorage.getItem('ee_email');

// ========== 15. Supabase 登录 ==========
async function sendSignInEmail(){
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const btn = document.getElementById('sendEmailBtn');

    if(!name || !email){
        alert("⚠️ 请填写完整的昵称和邮箱！");
        return;
    }

    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
        const { error } = await supabaseApp.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: window.location.origin }
        });

        if(error) throw error;

        localStorage.setItem('ee_nickname', name);
        localStorage.setItem('ee_email', email);
        document.getElementById('myBtn').innerText = `👤 ${name}`;

        alert("✨ 验证邮件已发送！请前往您的邮箱查收，并点击邮件中的 Sign In 链接完成绑定。");
        closeMyPop();
    } catch (err) {
        alert("❌ 发送失败：" + (err.message || "请检查邮箱或网络配置"));
    } finally {
        btn.disabled = false;
        btn.innerText = "发送邮件并绑定";
    }
}

// ========== 16. 语音输入 ==========
const voiceBtn = document.getElementById('voiceBtn');
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onresult = function(e){
        document.getElementById('input').value = e.results[0][0].transcript;
    };
}

let isRecording = false;
const startVoice = (e) => {
    e.preventDefault();
    if(!recognition){
        alert("当前浏览器暂不支持语音识别功能");
        return;
    }
    if(isRecording) return;
    isRecording = true;
    voiceBtn.style.transform = "scale(0.85)";
    try{ recognition.start(); }catch(err){}
};

const stopVoice = (e) => {
    e.preventDefault();
    if(!isRecording) return;
    isRecording = false;
    voiceBtn.style.transform = "scale(1)";
    try{ recognition.stop(); }catch(err){}
};

voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', stopVoice);
voiceBtn.addEventListener('mouseleave', stopVoice);
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', stopVoice);

</script>
