<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ 岛屿口语手帐 · Global Survival</title>
    <!-- 引入高级的手绘与衬线字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #F7F5F0;        /* 高级燕麦纸张色 */
            --card-bg: #FFFFFF;         /* 纯白质感纸面 */
            --border-dark: #2C2A29;     /* 极简高级炭黑线条 */
            --accent-terracotta: #D97706; /* 陶土橘点缀 */
            --accent-sage: #658A6C;     /* 森林绿/成功色 */
            --text-main: #2C2A29;
            --text-muted: #78716C;
            --soft-shadow: 0 10px 30px -10px rgba(44, 42, 41, 0.08);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            /* 模拟手绘不规则圆角 */
            border-radius: 28px 24px 30px 22px;
            border: 2px solid var(--border-dark);
            padding: 24px 20px;
            box-shadow: var(--soft-shadow), 6px 6px 0px rgba(44, 42, 41, 0.9);
            position: relative;
        }

        /* 顶部标题栏 */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .brand-title {
            font-family: 'Caveat', cursive, serif;
            font-size: 2.2rem;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
            font-weight: 600;
        }

        .brand-sub {
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-top: 2px;
        }

        /* 状态与控制栏 */
        .top-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: #FAF8F5;
            padding: 8px 12px;
            border-radius: 14px;
            border: 1.5px solid var(--border-dark);
        }

        .user-tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .stats-group {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* 题目卡片：模拟精致手帐内页 */
        .sketch-card {
            background: #FFFEFC;
            border: 2px dashed #D6D1C7;
            border-radius: 20px;
            padding: 22px 16px;
            text-align: center;
            margin-bottom: 20px;
            position: relative;
        }

        .category-pill {
            display: inline-block;
            background: #F3EFE6;
            color: var(--text-main);
            border: 1.5px solid var(--border-dark);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .chinese-prompt {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .hint-text {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 18px;
            font-family: monospace;
        }

        /* 优雅的输入框 */
        .input-wrapper {
            margin-bottom: 16px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            background: #FFFFFF;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--accent-terracotta);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1);
        }

        /* 语音与工具按钮 */
        .tools-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 18px;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 1.5px solid var(--border-dark);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-dark);
            transition: transform 0.1s;
        }

        .icon-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }

        /* 底部主操作按钮 */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sketch-btn {
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-dark);
            transition: all 0.1s ease;
            background: #FFFFFF;
            color: var(--text-main);
        }

        .sketch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }

        .sketch-btn.primary {
            background: #111827; /* 高级深碳黑 */
            color: #FFFFFF;
        }

        .sketch-btn.full {
            grid-column: span 2;
        }

        /* 反馈区域 */
        #result-box {
            margin-top: 15px;
            font-size: 0.85rem;
            font-weight: 700;
            min-height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .feedback-success {
            background: #F0FDF4;
            color: #166534;
            border: 1.5px solid var(--border-dark);
        }

        .feedback-error {
            background: #FEF2F2;
            color: #991B1B;
            border: 1.5px solid var(--border-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 品牌页头 -->
        <div class="header">
            <div class="brand-title">Global Survival Sketchbook</div>
            <div class="brand-sub">✦ 职场与出海口语手帐 ✦</div>
        </div>

        <!-- 顶部信息：游客状态 + 积分连击 -->
        <div class="top-info-bar">
            <div class="user-tag">👤 <span>本地练习生</span></div>
            <div class="stats-group">
                <div>🔥 <span id="streak">0</span></div>
                <div>⭐ <span id="score">0</span></div>
            </div>
        </div>

        <!-- 核心手帐卡片 -->
        <div class="sketch-card">
            <div id="category-pill" class="category-pill">✈️ 载入中...</div>
            <div class="chinese-prompt" id="chinese-text">正在翻阅手帐页面...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="请在此写下你的英文表达..." autocomplete="off"></textarea>
            </div>

            <div class="tools-row">
                <button class="icon-btn" onclick="speakTarget()" title="朗读标准发音">🔊</button>
                <button class="icon-btn" onclick="clearInput()" title="清空内容">🧹</button>
            </div>

            <div class="action-grid">
                <button class="sketch-btn primary" onclick="checkAnswer()">提交回答 ✍️</button>
                <button class="sketch-btn" onclick="nextQuestion()">换一题 🍃</button>
                <button class="sketch-btn full" onclick="showAnswer()">偷看参考答案 👀</button>
            </div>
        </div>

        <div id="result-box"></div>
    </div>

    <script>
        // 题库数据：真实海外出海与职场情境
        const questions = [
            { category: "✈️ 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "Hint: Where is the boarding gate..." },
            { category: "🧳 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "Hint: air conditioner / switch rooms" },
            { category: "🍜 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "Hint: contain peanuts / allergic" },
            { category: "🚕 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "Hint: subway station / nearby" },
            { category: "💼 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "Hint: Can everyone hear me? / microphone" },
            { category: "💼 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "Hint: Regarding this project / thoughts" },
            { category: "💼 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "Hint: Sorry to interrupt / quick question" },
            { category: "💼 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "Hint: ahead of schedule / expect to" },
            { category: "💼 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "Hint: plate is full / might not have time" }
        ];

        let currentIndex = 0;
        let score = 0;
        let streak = 0;

        function loadQuestion() {
            currentIndex = Math.floor(Math.random() * questions.length);
            const q = questions[currentIndex];
            document.getElementById("category-pill").innerText = q.category;
            document.getElementById("chinese-text").innerHTML = `“${q.chinese}”`;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            const resultBox = document.getElementById("result-box");
            resultBox.innerHTML = "";
            resultBox.className = "";
        }

        function checkAnswer() {
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = questions[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultBox = document.getElementById("result-box");

            if (!cleanUser) {
                resultBox.className = "feedback-error";
                resultBox.innerText = "⚠️ 请先写下你的英文回答哦";
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length > 5 && cleanTarget.includes(cleanUser))) {
                score += 10;
                streak += 1;
                resultBox.className = "feedback-success";
                resultBox.innerHTML = "✨ 回答完美！生存连击 +1";
                setTimeout(nextQuestion, 1500);
            } else {
                streak = 0;
                resultBox.className = "feedback-error";
                resultBox.innerHTML = `💡 差一点，参考标准表达：<br><b>${questions[currentIndex].english}</b>`;
            }
            updateStats();
        }

        function showAnswer() {
            const resultBox = document.getElementById("result-box");
            resultBox.className = "feedback-error";
            resultBox.innerHTML = `💡 手帐参考答案：<br><b>${questions[currentIndex].english}</b>`;
            streak = 0;
            updateStats();
        }

        function nextQuestion() {
            loadQuestion();
        }

        function clearInput() {
            document.getElementById("user-input").value = "";
            document.getElementById("user-input").focus();
        }

        function speakTarget() {
            const text = questions[currentIndex].english;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function updateStats() {
            document.getElementById("score").innerText = score;
            document.getElementById("streak").innerText = streak;
        }

        // 初始化
        loadQuestion();
    </script>
</body>
</html>
