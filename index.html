<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Easy English</title>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#FFF9F0;
font-family:"PingFang SC","Microsoft YaHei",sans-serif;
color:#403C3A
}
.app{
max-width:430px;
margin:auto;
padding:24px
}
.header{
display:flex;
justify-content:space-between;
align-items:center
}
.logo{
font-size:34px;
font-weight:900
}
.logo span{
color:#8CAFFF
}
.status{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:10px;
font-size:13px;
box-shadow:3px 3px 0 #403C3A
}
.install{
margin-top:8px;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px;
font-size:13px;
text-align:center
}
.card{
margin-top:25px;
background:#fff;
border:2px solid #403C3A;
border-radius:30px;
padding:25px;
box-shadow:5px 5px 0 #403C3A
}
.title{
text-align:center;
color:#777;
margin-bottom:20px
}
.tabs{
display:flex;
border:2px solid #403C3A;
border-radius:18px;
overflow:hidden
}
.tabs button{
flex:1;
padding:12px;
border:0;
background:#fff;
font-weight:bold
}
.tabs .active{
background:#EEF4FF;
color:#668FEA
}
.category{
margin:20px auto;
width:max-content;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px 14px;
font-size:13px
}
.question{
text-align:center;
font-size:28px;
font-weight:bold;
color:#8CAFFF;
margin:25px 0 10px
}
.synonyms{
text-align:center;
font-size:13px;
color:#999;
margin-bottom:25px
}
textarea{
width:100%;
height:90px;
border:2px solid #403C3A;
border-radius:20px;
padding:15px;
font-size:16px
}
.buttons{
display:flex;
gap:10px;
margin-top:15px
}
.buttons button{
flex:1;
padding:12px;
border-radius:18px;
border:2px solid #403C3A;
font-weight:bold;
box-shadow:3px 3px 0 #403C3A
}
.submit{background:#F3A9BF}
.next{background:#FFE5A6}
.answer{background:#EEF4FF}
.result{
display:none;
margin-top:20px;
background:#EAF6EA;
padding:15px;
border-radius:18px;
text-align:center
}
.audio{
border:0;
background:none;
font-size:18px;
cursor:pointer
}
footer{
margin-top:25px;
display:flex;
justify-content:space-between
}
footer button{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:12px
}
.surprise{
background:#FFF1C9
}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
justify-content:center;
align-items:center
}
.modal-box{
width:85%;
background:#FFF9F0;
border:2px solid #403C3A;
border-radius:28px;
padding:30px;
text-align:center
}
.wechat{
color:#07C160;
font-size:22px;
font-weight:bold
}
.modal-box button{
width:100%;
padding:14px;
border-radius:18px;
border:2px solid #403C3A;
background:#F3A9BF
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">Easy <span>English</span></div>
<div>
<div class="status">🔥 连续打卡<br>⭐120</div>
<div class="install">📲 下载App</div>
</div>
</div>


<div class="card">

<div class="title">
每天3分钟，让英语偷偷长出来 🌱
</div>

<div class="tabs">
<button id="wordTab" class="active">🔤 单词</button>
<button id="phraseTab">💬 短语</button>
</div>

<div id="category" class="category"></div>

<div id="question" class="question"></div>

<div id="synonyms" class="synonyms"></div>

<textarea id="input" placeholder="输入英文..."></textarea>

<div class="buttons">
<button class="submit" onclick="check()">✍️提交</button>
<button class="next" onclick="next()">🍃换题</button>
<button class="answer" onclick="answer()">👀答案</button>
</div>

<div id="result" class="result"></div>

</div>


<footer>
<button class="surprise" onclick="openPop()">✨ 点击有惊喜</button>
<button>👤 我的</button>
</footer>

</div>


<div id="modal" class="modal">
<div class="modal-box">
<p>👀 偷偷认识美丽且智慧的开发者</p>
<p>她正在努力让英语有趣一点儿 🤣</p>
<p>
🌱 微信：
<br>
<span class="wechat">vildbloom</span>
</p>
<button onclick="closePop()">我倒是要看看</button>
</div>
</div>


<script>

const words=[
{
id:1,
category:"✈️旅行",
question:"登机口",
answer:"boarding gate",
phonetic:"/ˈbɔːrdɪŋ ɡeɪt/",
synonyms:["gate","boarding area"]
},
{
id:2,
category:"💼商务工作",
question:"截止日期",
answer:"deadline",
phonetic:"/ˈdedlaɪn/",
synonyms:["due date","time limit"]
},
{
id:3,
category:"🎵音乐文化",
question:"歌词",
answer:"lyrics",
phonetic:"/ˈlɪrɪks/",
synonyms:["words","text"]
},
{
id:4,
category:"☕日常口语",
question:"尴尬的",
answer:"awkward",
phonetic:"/ˈɔːkwərd/",
synonyms:["embarrassing","uncomfortable"]
}
];


const phrases=[
{
id:101,
category:"✈️旅行",
question:"请问去机场怎么走？",
answer:"How can I get to the airport?"
},
{
id:102,
category:"💼商务工作",
question:"我们之后同步一下",
answer:"Let's sync up later."
},
{
id:103,
category:"❤️社交",
question:"最近怎么样？",
answer:"How have you been lately?"
}
];


let type="word";
let current;
let used=JSON.parse(localStorage.used||"[]");


function pool(){
return type==="word"?words:phrases
}


function next(){

let list=pool().filter(x=>!used.includes(x.id));

if(!list.length){
used=[];
list=pool()
}

current=list[Math.floor(Math.random()*list.length)];

used.push(current.id);

localStorage.used=JSON.stringify(used);

render();

}


function render(){

category.innerHTML=current.category;

question.innerHTML=current.question;

synonyms.innerHTML=
type==="word"
?"近义词："+current.synonyms.join(" · ")
:"";

input.value="";

result.style.display="none";

}


wordTab.onclick=()=>{

type="word";

wordTab.classList.add("active");

phraseTab.classList.remove("active");

next();

}


phraseTab.onclick=()=>{

type="phrase";

phraseTab.classList.add("active");

wordTab.classList.remove("active");

next();

}



function answer(){

result.style.display="block";

if(type==="word"){

result.innerHTML=
`
<b>${current.answer}</b>
&nbsp;
${current.phonetic}
<button class="audio" onclick="speak('${current.answer}')">🔊</button>
`;

}else{

result.innerHTML=
`<b>${current.answer}</b>`;

}

}



function check(){

let v=input.value.toLowerCase();

result.style.display="block";

result.innerHTML=
current.answer.toLowerCase().includes(v)
?"✨ Nice！"
:"💡 再试试看";

}



function speak(t){

let u=new SpeechSynthesisUtterance(t);

u.lang="en-US";

u.rate=.85;

speechSynthesis.speak(u);

}



function openPop(){

modal.style.display="flex";

}


function closePop(){

modal.style.display="none";

}


next();

</script>

</body>
</html>
