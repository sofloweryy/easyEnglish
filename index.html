<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ Easy English ✦</title>
    <!-- 引入Google Fonts的手写可爱风字体（Ma Shan Zheng / ZCOOL KuaiLe）及Quicksand -->
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@700&family=Quicksand:wght@600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FAF6ED;
            --card-bg: #FFFFFF;
            --border-dark: #2C2A29;
            --accent-terracotta: #E07A5F;
            --text-main: #2C2A29;
            --text-muted: #8C8275;
            /* 定义全局手写体变量 */
            --font-handwriting: 'ZCOOL KuaiLe', cursive, sans-serif;
            --font-title-hand: 'Ma Shan Zheng', cursive, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            /* 整体采用可爱手写风字体 */
            font-family: var(--font-handwriting);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 28px 22px 24px 24px;
            border: 2.5px solid var(--border-dark);
            padding: 16px 14px;
            box-shadow: 5px 7px 0px rgba(44, 42, 41, 0.85);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 8px;
        }

        .brand-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
            text-shadow: 2px 2px 0px #FFE5EC;
        }

        /* 模式切换卡片开关 */
        .mode-switch-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
            background: #F3EFEA;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
        }

        .mode-tab {
            background: transparent;
            border: none;
            font-family: var(--font-handwriting);
            font-size: 1.1rem;
            font-weight: 400;
            padding: 6px 0;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.1s ease;
        }

        .mode-tab.active {
            background: #FFFFFF;
            color: var(--text-main);
            border: 1.5px solid var(--border-dark);
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
        }

        /* 顶部信息面板 */
        .top-info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            background: #FFF1F2;
            padding: 8px 12px;
            border-radius: 14px;
            border: 2px solid var(--border-dark);
            box-shadow: 2.5px 2.5px 0px var(--border-dark);
            font-family: var(--font-handwriting);
        }

        .user-section {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 1.1rem;
        }

        .user-tag span {
            color: var(--accent-terracotta);
        }

        .login-mini-btn {
            background: #FFE5EC;
            color: var(--border-dark);
            border: 1.5px solid var(--border-dark);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 1px 1px 0px var(--border-dark);
            font-family: var(--font-handwriting);
        }
        .login-mini-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .stats-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 2px;
            font-size: 1.1rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        /* 核心卡片 */
        .sketch-card {
            background: #FFFCF7;
            border: 2px dashed #E6DEC9;
            border-radius: 16px;
            padding: 14px 12px;
            text-align: center;
            margin-bottom: 10px;
            position: relative;
        }

        .category-pill {
            display: inline-block;
            background: #E8F5E9;
            color: #2E7D32;
            border: 2px solid var(--border-dark);
            padding: 2px 14px;
            border-radius: 16px;
            font-size: 1.05rem;
            margin-bottom: 6px;
            box-shadow: 2px 2px 0px var(--border-dark);
            font-family: var(--font-handwriting);
        }

        .chinese-prompt {
            font-family: var(--font-title-hand);
            font-size: 1.6rem;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .hint-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .input-container-wrapper {
            position: relative;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 64px;
            padding: 8px 38px 8px 10px;
            font-size: 1.15rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border: 2px solid var(--border-dark);
            border-radius: 12px;
            background: #FFFFFF;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            user-select: text;
        }

        textarea::placeholder {
            font-family: var(--font-handwriting);
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        textarea:focus {
            border-color: var(--accent-terracotta);
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .inline-tools {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mini-tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            transition: all 0.08s ease;
        }

        .mini-tool-btn:active, .mini-tool-btn.recording {
            transform: translate(1px, 1px);
            box-shadow: none;
            background: #FF8FA3;
            color: white;
        }

        .voice-status-tip {
            font-size: 1rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            height: 22px;
            font-family: var(--font-handwriting);
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            gap: 6px;
        }

        .sketch-btn {
            font-family: var(--font-handwriting);
            font-size: 1.15rem;
            padding: 8px 4px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-dark);
            transition: all 0.08s ease;
            background: #FFFFFF;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
        }

        .sketch-btn:active {
            transform: translate(1.5px, 1.5px);
            box-shadow: 0.5px 0.5px 0px var(--border-dark);
        }

        .sketch-btn.primary {
            background: #2C2A29;
            color: #FFFFFF;
        }

        #result-box {
            margin-top: 8px;
            font-size: 1.15rem;
            font-family: var(--font-handwriting);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            padding: 6px 10px;
            text-align: left;
            border: 2px solid var(--border-dark);
            box-shadow: 2.5px 2.5px 0px var(--border-dark);
            gap: 6px;
        }

        .feedback-success { background: #E8F5E9; color: #2E7D32; }
        .feedback-error { background: #FFEBEE; color: #C62828; }

        .answer-audio-btn {
            background: #FFF;
            border: 1.5px solid var(--border-dark);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-handwriting);
        }
        .answer-audio-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
            background: #FFE5EC;
        }

        /* 底部价格惊喜按钮 */
        .surprise-btn {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            background: #FFF5F7;
            color: var(--accent-terracotta);
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 10px;
            font-family: var(--font-handwriting);
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 3px 4px 0px var(--border-dark);
            transition: all 0.08s ease;
            text-align: center;
        }
        .surprise-btn:active {
            transform: translate(1.5px, 1.5px);
            box-shadow: 1px 1.5px 0px var(--border-dark);
        }

        /* 通用弹窗背景 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 42, 41, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #FFFCF7;
            border: 2.5px solid var(--border-dark);
            border-radius: 20px;
            padding: 16px;
            width: 90%;
            max-width: 320px;
            box-shadow: 5px 7px 0px var(--border-dark);
            text-align: left;
            font-family: var(--font-handwriting);
        }

        .modal-card h3 {
            margin: 0 0 4px 0;
            font-size: 1.6rem;
            text-align: center;
            font-family: var(--font-title-hand);
        }

        .modal-card label {
            display: block;
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .modal-card input {
            width: 100%;
            padding: 6px 10px;
            margin-top: 2px;
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            outline: none;
            background: #FFF;
        }

        .modal-card input::placeholder {
            font-family: var(--font-handwriting);
            font-size: 1rem;
            color: var(--text-muted);
        }

        .verify-row {
            display: flex;
            gap: 6px;
            margin-top: 2px;
        }
        .verify-row input { margin-top: 0; }

        .verify-btn {
            background: #FFE5EC;
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            padding: 0 8px;
            font-size: 1.05rem;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            font-family: var(--font-handwriting);
        }
        .verify-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-title">Easy English</div>
        </div>

        <!-- 模式切换开关 -->
        <div class="mode-switch-bar">
            <button class="mode-tab active" id="tab-word" onclick="switchMode('word')">🔤 高频单词</button>
            <button class="mode-tab" id="tab-phrase" onclick="switchMode('phrase')">💬 常用短语</button>
        </div>

        <!-- 顶部信息面板 -->
        <div class="top-info-panel">
            <div class="user-section">
                <div class="user-info-row">
                    <span class="user-tag">👤 <span id="user-display">本地游客</span></span>
                </div>
                <button class="login-mini-btn" onclick="openLoginModal()" id="login-btn-text">点击云端绑定</button>
            </div>
            <div class="stats-group">
                <div class="stat-item">🔥 打卡:<span id="streak">1</span>天</div>
                <div class="stat-item">⭐ 积分:<span id="score">10</span>分</div>
            </div>
        </div>

        <div class="sketch-card">
            <div id="category-pill" class="category-pill">🔥 载入中...</div>
            <div class="chinese-prompt" id="chinese-text">正在翻阅手帐页面...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-container-wrapper">
                <textarea id="user-input" placeholder="请在此输入英文..." autocomplete="off"></textarea>
                <div class="inline-tools">
                    <button class="mini-tool-btn" id="voice-btn" title="长按语音输入">🎤</button>
                </div>
            </div>
            <div class="voice-status-tip" id="voice-tip">长按麦克风可说话转文字</div>

            <div class="action-grid">
                <button class="sketch-btn primary" onclick="checkAnswer()">提交 ✍️</button>
                <button class="sketch-btn" onclick="nextQuestion()">换题 🍃</button>
                <button class="sketch-btn" onclick="showAnswer()">答案 👀</button>
            </div>
        </div>

        <div id="result-box"></div>
    </div>

    <!-- 底部价格惊喜按钮 -->
    <button class="surprise-btn" onclick="openSurpriseModal()">✨ 点击有惊喜</button>

    <!-- 登录/绑定弹窗 -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>云端账号同步</h3>
            <p style="font-size: 0.95rem; color: var(--text-muted); text-align: center; margin: 0 0 6px 0; font-family: var(--font-handwriting);">直接设置昵称本地畅玩，或使用邮箱验证码同步</p>
            
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="例如：手帐达人">

            <label>电子邮箱 (可选)</label>
            <input type="email" id="reg-account" placeholder="请输入常用邮箱">

            <label>6位随机验证码 (若收不到可直接点上方保存昵称)</label>
            <div class="verify-row">
                <input type="text" id="reg-code" placeholder="输入6位数" maxlength="6">
                <button class="verify-btn" onclick="sendOtpCode()">获取验证码</button>
            </div>

            <button class="sketch-btn primary" style="width: 100%; margin: 12px 0 4px 0;" onclick="saveProfileAndLogin()">保存昵称 / 绑定登录</button>
            <button class="sketch-btn" style="width: 100%; background: #E5E7EB;" onclick="closeLoginModal()">取消</button>
        </div>
    </div>

    <!-- 惊喜提示弹窗 -->
    <div id="surprise-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <p style="font-size: 1.2rem; line-height: 1.6; color: var(--text-main); margin: 8px 0 16px 0; font-family: var(--font-handwriting);">
                联系美丽且智慧的开发者<br>
                <span style="color: #2E7D32; font-size: 1.05rem; word-break: break-all; font-family: 'Quicksand', sans-serif;">zhaihuahua1701@gmail.com</span>
            </p>
            <button class="sketch-btn primary" style="width: 100%; margin-top: 8px;" onclick="closeSurpriseModal()">收下啦 ❤️</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let score = 10;
        let streak = 1; 
        let currentMode = 'word';

        const questionBanks = {
            word: [
                { category: "🔥 高频单词", chinese: "高效的、有成效的", english: "efficient", phonetic: "[ɪˈfɪʃnt]", hint: "Hint: e _ _ _ _ _ _ t (9 letters)" },
                { category: "🔥 高频单词", chinese: "灵感、启发", english: "inspiration", phonetic: "[ˌɪnspəˈreɪʃn]", hint: "Hint: i _ _ _ _ _ _ _ _ n (11 letters)" },
                { category: "🔥 高频单词", chinese: "优先事项、首要任务", english: "priority", phonetic: "[praɪˈɔːrəti]", hint: "Hint: p _ _ _ _ _ _ y (8 letters)" },
                { category: "🔥 高频单词", chinese: "灵活的、可变通的", english: "flexible", phonetic: "[ˈfleksəbl]", hint: "Hint: f _ _ _ _ _ _ e (8 letters)" },
                { category: "🔥 高频单词", chinese: "策略、战略", english: "strategy", phonetic: "[ˈstrætədʒi]", hint: "Hint: s _ _ _ _ _ _ y (8 letters)" },
                { category: "🔥 高频单词", chinese: "合作、协作", english: "collaboration", phonetic: "[kəˌlæbəˈreɪʃn]", hint: "Hint: c _ _ _ _ _ _ _ _ _ _ _ n (13 letters)" },
                { category: "🔥 高频单词", chinese: "成就、成绩", english: "achievement", phonetic: "[əˈtʃiːvmənt]", hint: "Hint: a _ _ _ _ _ _ _ _ _ t (11 letters)" },
                { category: "🔥 高频单词", chinese: "挑战、质疑", english: "challenge", phonetic: "[ˈtʃælɪndʒ]", hint: "Hint: c _ _ _ _ _ _ _ e (9 letters)" }
            ],
            phrase: [
                { category: "✈️ 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "Hint: Where is the boarding gate..." },
                { category: "🧳 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "Hint: air conditioner / switch rooms" },
                { category: "🍜 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "Hint: contain peanuts / allergic" },
                { category: "🚕 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "Hint: subway station / nearby" },
                { category: "💼 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "Hint: Can everyone hear me? / microphone" },
                { category: "💼 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "Hint: Regarding this project / thoughts" },
                { category: "💼 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "Hint: Sorry to interrupt / quick question" },
                { category: "💼 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "Hint: ahead of schedule / expect to" },
                { category: "💼 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "Hint: plate is full / might not have time" }
            ]
        };

        let currentIndex = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserData();
            } else {
                const localName = localStorage.getItem('ee_nickname');
                const localScore = localStorage.getItem('ee_score');
                const localStreak = localStorage.getItem('ee_streak');
                if (localName) {
                    document.getElementById('user-display').innerText = localName;
                    document.getElementById('login-btn-text').innerText = '切换/修改';
                }
                if (localScore) score = parseInt(localScore);
                if (localStreak) streak = parseInt(localStreak);
                
                checkDailyCheckIn();
                updateStatsUI();
            }
            initSpeechRecognition();
            loadQuestion();
        });

        function checkDailyCheckIn() {
            const todayStr = new Date().toDateString();
            const lastCheckInDate = localStorage.getItem('ee_last_checkin_date');

            if (lastCheckInDate !== todayStr) {
                streak += 1;
                localStorage.setItem('ee_last_checkin_date', todayStr);
                localStorage.setItem('ee_streak', streak);
            }
        }

        function updateStatsUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-word').className = mode === 'word' ? 'mode-tab active' : 'mode-tab';
            document.getElementById('tab-phrase').className = mode === 'phrase' ? 'mode-tab active' : 'mode-tab';
            loadQuestion();
        }

        function openLoginModal() { 
            const currentName = document.getElementById('user-display').innerText;
            if (currentName !== '本地游客') {
                document.getElementById('reg-nickname').value = currentName;
            }
            document.getElementById('login-modal').style.display = 'flex'; 
        }
        function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

        function openSurpriseModal() { document.getElementById('surprise-modal').style.display = 'flex'; }
        function closeSurpriseModal() { document.getElementById('surprise-modal').style.display = 'none'; }

        async function sendOtpCode() {
            const email = document.getElementById('reg-account').value.trim();
            if (!email || !email.includes('@')) {
                alert('请先输入正确的电子邮箱地址！');
                return;
            }

            const { error } = await _supabase.auth.signInWithOtp({
                email: email,
                options: { shouldCreateUser: true }
            });

            if (error) {
                if (error.message.includes('rate limit')) {
                    alert('⚠️ 触发了邮件发送频率限制。你可以直接输入昵称并点“保存昵称”直接游玩！');
                } else {
                    alert('发送失败: ' + error.message);
                }
            } else {
                alert('✅ 随机 6 位验证码已发送至您的邮箱！');
            }
        }

        async function saveProfileAndLogin() {
            const nickname = document.getElementById('reg-nickname').value.trim() || "手帐练习生";
            const email = document.getElementById('reg-account').value.trim();
            const token = document.getElementById('reg-code').value.trim();

            if (email && token) {
                const { data, error } = await _supabase.auth.verifyOtp({
                    email: email,
                    token: token,
                    type: 'email'
                });
                if (error) {
                    alert('验证码错误或已失效，但已为你成功保存本地昵称！');
                } else {
                    currentUser = data.user;
                }
            }

            document.getElementById('user-display').innerText = nickname;
            document.getElementById('login-btn-text').innerText = '切换/修改';
            localStorage.setItem('ee_nickname', nickname);
            
            if (currentUser) {
                await _supabase.from('user_profiles').upsert({
                    id: currentUser.id,
                    nickname: nickname,
                    score: score,
                    streak: streak,
                    updated_at: new Date()
                });
            }

            alert('✨ 昵称保存成功！开始打卡吧~');
            closeLoginModal();
        }

        async function fetchUserData() {
            if (!currentUser) return;
            const { data } = await _supabase
                .from('user_profiles')
                .select('nickname, score, streak')
                .eq('id', currentUser.id)
                .single();
            
            if (data) {
                score = data.score || 0;
                streak = data.streak || 0;
                
                const todayStr = new Date().toDateString();
                const lastCheckInDate = localStorage.getItem('ee_last_checkin_date');
                if (lastCheckInDate !== todayStr) {
                    streak += 1;
                    localStorage.setItem('ee_last_checkin_date', todayStr);
                }

                document.getElementById('user-display').innerText = data.nickname || "已绑定用户";
                document.getElementById('login-btn-text').innerText = '已同步云端';
                updateStatsUI();
                syncUserDataToCloud();
            }
        }

        async function syncUserDataToCloud() {
            localStorage.setItem('ee_score', score);
            localStorage.setItem('ee_streak', streak);

            if (!currentUser) return;
            await _supabase
                .from('user_profiles')
                .update({ score: score, streak: streak, updated_at: new Date() })
                .eq('id', currentUser.id);
        }

        function loadQuestion() {
            const list = questionBanks[currentMode];
            currentIndex = Math.floor(Math.random() * list.length);
            const q = list[currentIndex];
            document.getElementById("category-pill").innerText = q.category;
            document.getElementById("chinese-text").innerText = q.chinese;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            const resultBox = document.getElementById("result-box");
            resultBox.innerHTML = "";
            resultBox.className = "";
        }

        function checkAnswer() {
            const list = questionBanks[currentMode];
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = list[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultBox = document.getElementById("result-box");

            if (!cleanUser) {
                resultBox.className = "feedback-error";
                resultBox.innerHTML = `<span style="font-size: 1.05rem;">⚠️ 请先输入或说出英文回答</span>`;
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length >= 3 && cleanTarget.includes(cleanUser))) {
                score += 10;
                resultBox.className = "feedback-success";
                resultBox.innerHTML = `✨ 回答完美！积分 +10`;
                setTimeout(nextQuestion, 1500);
            } else {
                resultBox.className = "feedback-error";
                let displayContent = list[currentIndex].english;
                if (currentMode === 'word' && list[currentIndex].phonetic) {
                    displayContent += ` <span style="font-size: 0.95rem; color: var(--text-muted); font-family: 'Quicksand', sans-serif;">${list[currentIndex].phonetic}</span>`;
                }
                resultBox.innerHTML = `<span style="font-family: 'Quicksand', sans-serif; font-size: 1.05rem;">💡 ${displayContent}</span>
                                      <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(list[currentIndex].english)}')">🔊 朗读</button>`;
            }
            updateStatsUI();
            syncUserDataToCloud();
        }

        function showAnswer() {
            const list = questionBanks[currentMode];
            const resultBox = document.getElementById("result-box");
            resultBox.className = "feedback-error";
            let displayContent = list[currentIndex].english;
            if (currentMode === 'word' && list[currentIndex].phonetic) {
                displayContent += ` <span style="font-size: 0.95rem; color: var(--text-muted); font-family: 'Quicksand', sans-serif;">${list[currentIndex].phonetic}</span>`;
            }
            resultBox.innerHTML = `<span style="font-family: 'Quicksand', sans-serif; font-size: 1.05rem;">💡 ${displayContent}</span>
                                  <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(list[currentIndex].english)}')">🔊 朗读</button>`;
            updateStatsUI();
            syncUserDataToCloud();
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const decodedText = decodeURIComponent(text);
            const utterance = new SpeechSynthesisUtterance(decodedText);
            utterance.lang = 'en-US';
            
            const voices = window.speechSynthesis.getVoices();
            const standardVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('US English'))) || voices.find(v => v.lang.startsWith('en'));
            if (standardVoice) {
                utterance.voice = standardVoice;
            }
            
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        function nextQuestion() {
            loadQuestion();
        }

        function initSpeechRecognition() {
            const btn = document.getElementById('voice-btn');
            const tip = document.getElementById('voice-tip');
            const inputArea = document.getElementById('user-input');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                tip.innerText = "浏览器不支持语音识别";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isHolding = false;

            const startRecording = (e) => {
                e.preventDefault();
                if (isHolding) return;
                isHolding = true;
                btn.classList.add('recording');
                tip.innerText = "正在聆听，请说话...";
                try {
                    recognition.start();
                } catch(err) {
                    console.log(err);
                }
            };

            const stopRecording = (e) => {
                e.preventDefault();
                if (!isHolding) return;
                isHolding = false;
                btn.classList.remove('recording');
                tip.innerText = "正在识别中...";
                try {
                    recognition.stop();
                } catch(err) {
                    console.log(err);
                }
            };

            btn.addEventListener('mousedown', startRecording);
            btn.addEventListener('mouseup', stopRecording);
            btn.addEventListener('mouseleave', stopRecording);

            btn.addEventListener('touchstart', startRecording);
            btn.addEventListener('touchend', stopRecording);

            recognition.onresult = (event) => {
                const speechToText = event.results[0][0].transcript;
                inputArea.value = speechToText;
                tip.innerText = "识别成功！点击提交查看";
            };

            recognition.onerror = () => {
                tip.innerText = "识别出错，请重试";
                btn.classList.remove('recording');
                isHolding = false;
            };

            recognition.onend = () => {
                btn.classList.remove('recording');
                isHolding = false;
                if(tip.innerText === "正在聆听，请说话...") {
                    tip.innerText = "长按麦克风可说话转文字";
                }
            };
        }
    </script>
