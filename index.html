<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ 轻松学习旅行/工作英语 ✦</title>
    <!-- 引入更有手写风与涂鸦感的英文字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Zeyada&family=Long+Cang&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F7F5F0;
            --card-bg: #FFFEFC;
            --border-dark: #2C2A29;
            --accent-terracotta: #D97706;
            --text-main: #2C2A29;
            --text-muted: #78716C;
            --soft-shadow: 4px 6px 0px rgba(44, 42, 41, 0.9);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: var(--card-bg);
            border-radius: 32px 24px 28px 30px;
            border: 2.5px solid var(--border-dark);
            padding: 24px 20px;
            box-shadow: 6px 8px 0px rgba(44, 42, 41, 0.85);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 18px;
        }

        /* 极致手写风格大标题 */
        .brand-title {
            font-family: 'Long Cang', cursive, serif;
            font-size: 2.4rem;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
        }

        .brand-sub {
            font-family: 'Caveat', cursive;
            font-size: 1.1rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        /* 顶部信息栏 */
        .top-info-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
            background: #FAF8F5;
            padding: 8px 12px;
            border-radius: 14px;
            border: 2px solid var(--border-dark);
        }

        .user-tag {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .user-tag span {
            color: var(--accent-terracotta);
            font-weight: bold;
        }

        .login-mini-btn {
            background: var(--border-dark);
            color: #FFF;
            border: none;
            padding: 5px 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .stats-group {
            display: flex;
            gap: 10px;
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* 核心手帐卡片 */
        .sketch-card {
            background: #FFFDF9;
            border: 2px dashed #C8C2B4;
            border-radius: 20px;
            padding: 20px 16px;
            text-align: center;
            margin-bottom: 16px;
            position: relative;
        }

        .category-pill {
            display: inline-block;
            background: #F3EFE6;
            color: var(--text-main);
            border: 2px solid var(--border-dark);
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 12px;
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        .chinese-prompt {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.5;
            margin-bottom: 8px;
        }

        .hint-text {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            font-family: 'Caveat', cursive, monospace;
            font-size: 1.05rem;
        }

        .input-wrapper {
            margin-bottom: 14px;
        }

        textarea {
            width: 100%;
            height: 75px;
            padding: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            background: #FFFFFF;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            user-select: text;
        }

        textarea:focus {
            border-color: var(--accent-terracotta);
            box-shadow: 0 0 0 3px rgba(217, 119, 6, 0.1), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        /* 语音与清空互动行 */
        .tools-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            margin-bottom: 16px;
        }

        .icon-btn-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .icon-btn {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-dark);
            transition: all 0.08s ease;
            font-size: 1.2rem;
        }

        .icon-btn:active, .icon-btn.active-press {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-dark);
            background: #FEF3C7;
        }

        .icon-tip {
            font-size: 0.65rem;
            color: var(--text-muted);
            font-weight: bold;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .sketch-btn {
            font-family: inherit;
            font-weight: 700;
            font-size: 0.9rem;
            padding: 12px;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-dark);
            transition: all 0.08s ease;
            background: #FFFFFF;
            color: var(--text-main);
        }

        .sketch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }

        .sketch-btn.primary {
            background: #111827;
            color: #FFFFFF;
        }

        .sketch-btn.full {
            grid-column: span 2;
        }

        #result-box {
            margin-top: 12px;
            font-size: 0.85rem;
            font-weight: 700;
            min-height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 8px;
            text-align: center;
        }

        .feedback-success { background: #F0FDF4; color: #166534; border: 2px solid var(--border-dark); }
        .feedback-error { background: #FEF2F2; color: #991B1B; border: 2px solid var(--border-dark); }

        /* 登录弹窗样式 */
        #login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 42, 41, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #FFFEFC;
            border: 2.5px solid var(--border-dark);
            border-radius: 24px;
            padding: 22px 20px;
            width: 90%;
            max-width: 350px;
            box-shadow: 6px 8px 0px var(--border-dark);
            text-align: left;
        }

        .modal-card h3 {
            margin: 0 0 4px 0;
            font-family: 'Long Cang', cursive;
            font-size: 2rem;
            text-align: center;
        }

        .modal-card label {
            display: block;
            font-size: 0.75rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-top: 10px;
        }

        .modal-card input {
            width: 100%;
            padding: 9px 12px;
            margin-top: 3px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
            background: #FFF;
        }

        .verify-row {
            display: flex;
            gap: 8px;
            margin-top: 3px;
        }

        .verify-row input {
            margin-top: 0;
        }

        .verify-btn {
            background: #E5E7EB;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 2px 2px 0px var(--border-dark);
        }
        .verify-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-title">轻松学习旅行/工作英语</div>
            <div class="brand-sub">✦ 职场与出海口语手帐 ✦</div>
        </div>

        <div class="top-info-bar">
            <div class="user-tag">👤 <span id="user-display">本地游客</span></div>
            <button class="login-mini-btn" onclick="openModal()" id="login-btn-text">绑定账号</button>
            <div class="stats-group">
                <div>🔥 <span id="streak">0</span></div>
                <div>⭐ <span id="score">0</span></div>
            </div>
        </div>

        <div class="sketch-card">
            <div id="category-pill" class="category-pill">✈️ 载入中...</div>
            <div class="chinese-prompt" id="chinese-text">正在翻阅手帐页面...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-wrapper">
                <textarea id="user-input" placeholder="请在此写下你的英文表达..." autocomplete="off"></textarea>
            </div>

            <!-- 长按发音与清空按钮区域 -->
            <div class="tools-row">
                <div class="icon-btn-container">
                    <button class="icon-btn" id="speak-btn" title="长按朗读标准发音">🔊</button>
                    <span class="icon-tip">长按朗读发音</span>
                </div>
                <div class="icon-btn-container">
                    <button class="icon-btn" onclick="clearInput()" title="清空内容">🧹</button>
                    <span class="icon-tip">点击清空</span>
                </div>
            </div>

            <div class="action-grid">
                <button class="sketch-btn primary" onclick="checkAnswer()">提交回答 ✍️</button>
                <button class="sketch-btn" onclick="nextQuestion()">换一题 🍃</button>
                <button class="sketch-btn full" onclick="showAnswer()">偷看参考答案 👀</button>
            </div>
        </div>

        <div id="result-box"></div>
    </div>

    <!-- 重新设计的注册/登录弹窗：昵称、手机号/邮箱、验证码、设置密码（非必填） -->
    <div id="login-modal">
        <div class="modal-card">
            <h3>云端账号同步</h3>
            <p style="font-size: 0.72rem; color: var(--text-muted); text-align: center; margin: 0 0 8px 0;">安全绑定，多端学习进度不丢失</p>
            
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="例如：手帐达人 / 杰克">

            <label>手机号 / 邮箱</label>
            <input type="text" id="reg-account" placeholder="请输入常用邮箱或11位手机号">

            <label>验证码</label>
            <div class="verify-row">
                <input type="text" id="reg-code" placeholder="6位验证码">
                <button class="verify-btn" onclick="sendVerifyCode()">获取验证码</button>
            </div>

            <label>设置密码 (非必填，用于快捷密码登录)</label>
            <input type="password" id="reg-password" placeholder="若设置至少6位数">

            <button class="sketch-btn primary" style="width: 100%; margin: 16px 0 8px 0;" onclick="handleAuthSubmit()">完成绑定 / 登录</button>
            <button class="sketch-btn" style="width: 100%; background: #E5E7EB;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        // === Supabase 初始化 ===
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let score = 0;
        let streak = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserData();
            }
            initLongPressAudio();
        });

        function openModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('login-modal').style.display = 'none'; }

        // 验证码模拟发送
        function sendVerifyCode() {
            const acc = document.getElementById('reg-account').value.trim();
            if (!acc) {
                alert('请先输入手机号或邮箱！');
                return;
            }
            alert('验证码已发送（演示模式：任意输入6位数字即可通过）');
        }

        // 登录/绑定提交逻辑
        async function handleAuthSubmit() {
            const nickname = document.getElementById('reg-nickname').value.trim() || "手帐练习生";
            const account = document.getElementById('reg-account').value.trim();
            const code = document.getElementById('reg-code').value.trim();
            const password = document.getElementById('reg-password').value.trim();

            if (!account) { alert('请输入手机号或邮箱！'); return; }
            if (!code || code.length < 4) { alert('请输入有效的验证码！'); return; }

            let loginEmail = account;
            const isPhone = /^1[3-9]\d{9}$/.test(account);
            if (isPhone) {
                loginEmail = `${account}@phone.local`;
            } else if (!account.includes('@')) {
                alert('请输入合法的邮箱或11位手机号！');
                return;
            }

            // 如果未设密码，自动匹配一个安全密码供Supabase创建账户
            const finalPassword = (password && password.length >= 6) ? password : "DefaultPassword123!";

            let { data, error } = await _supabase.auth.signInWithPassword({
                email: loginEmail,
                password: finalPassword
            });

            if (error) {
                const signUpRes = await _supabase.auth.signUp({
                    email: loginEmail,
                    password: finalPassword,
                    options: { data: { nickname: nickname } }
                });
                if (signUpRes.error) {
                    alert('绑定失败: ' + signUpRes.error.message);
                    return;
                }
                currentUser = signUpRes.data.user;
                alert('🎉 账号绑定成功！');
            } else {
                currentUser = data.user;
                alert('🎉 登录成功！');
            }

            if (currentUser) {
                await _supabase.from('user_profiles').upsert({
                    id: currentUser.id,
                    nickname: nickname,
                    updated_at: new Date()
                });
            }

            closeModal();
            window.location.reload();
        }

        async function fetchUserData() {
            if (!currentUser) return;
            const { data } = await _supabase
                .from('user_profiles')
                .select('nickname, score, streak')
                .eq('id', currentUser.id)
                .single();
            
            if (data) {
                score = data.score || 0;
                streak = data.streak || 0;
                document.getElementById('user-display').innerText = data.nickname || "已绑定用户";
                document.getElementById('login-btn-text').innerText = '已同步';
                updateStatsUI();
            }
        }

        async function syncUserDataToCloud() {
            if (!currentUser) return;
            await _supabase
                .from('user_profiles')
                .update({ score: score, streak: streak, updated_at: new Date() })
                .eq('id', currentUser.id);
        }

        // === 题库与交互逻辑 ===
        const questions = [
            { category: "✈️ 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "Hint: Where is the boarding gate..." },
            { category: "🧳 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "Hint: air conditioner / switch rooms" },
            { category: "🍜 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "Hint: contain peanuts / allergic" },
            { category: "🚕 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "Hint: subway station / nearby" },
            { category: "💼 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "Hint: Can everyone hear me? / microphone" },
            { category: "💼 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "Hint: Regarding this project / thoughts" },
            { category: "💼 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "Hint: Sorry to interrupt / quick question" },
            { category: "💼 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "Hint: ahead of schedule / expect to" },
            { category: "💼 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "Hint: plate is full / might not have time" }
        ];

        let currentIndex = 0;

        function loadQuestion() {
            currentIndex = Math.floor(Math.random() * questions.length);
            const q = questions[currentIndex];
            document.getElementById("category-pill").innerText = q.category;
            document.getElementById("chinese-text").innerHTML = `“${q.chinese}”`;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            const resultBox = document.getElementById("result-box");
            resultBox.innerHTML = "";
            resultBox.className = "";
        }

        function checkAnswer() {
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = questions[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultBox = document.getElementById("result-box");

            if (!cleanUser) {
                resultBox.className = "feedback-error";
                resultBox.innerText = "⚠️ 请先写下你的英文回答哦";
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length > 5 && cleanTarget.includes(cleanUser))) {
                score += 10;
                streak += 1;
                resultBox.className = "feedback-success";
                resultBox.innerHTML = "✨ 回答完美！生存连击 +1";
                setTimeout(nextQuestion, 1500);
            } else {
                streak = 0;
                resultBox.className = "feedback-error";
                resultBox.innerHTML = `💡 差一点，参考标准表达：<br><b>${questions[currentIndex].english}</b>`;
            }
            updateStatsUI();
            syncUserDataToCloud();
        }

        function showAnswer() {
            const resultBox = document.getElementById("result-box");
            resultBox.className = "feedback-error";
            resultBox.innerHTML = `💡 手帐参考答案：<br><b>${questions[currentIndex].english}</b>`;
            streak = 0;
            updateStatsUI();
            syncUserDataToCloud();
        }

        function nextQuestion() {
            loadQuestion();
        }

        function clearInput() {
            document.getElementById("user-input").value = "";
            document.getElementById("user-input").focus();
        }

        // 长按发音逻辑实现（兼容手机端触控与PC鼠标长按）
        function initLongPressAudio() {
            const btn = document.getElementById('speak-btn');
            let pressTimer = null;
            let isLongPress = false;

            const startAction = (e) => {
                e.preventDefault();
                isLongPress = false;
                btn.classList.add('active-press');
                
                pressTimer = setTimeout(() => {
                    isLongPress = true;
                    playStandardAudio();
                }, 400); // 触发长按（400毫秒）
            };

            const endAction = (e) => {
                e.preventDefault();
                btn.classList.remove('active-press');
                if (pressTimer) clearTimeout(pressTimer);
                
                // 如果不是长按（即快速轻击），也可以触发一次播放
                if (!isLongPress) {
                    playStandardAudio();
                }
            };

            btn.addEventListener('mousedown', startAction);
            btn.addEventListener('mouseup', endAction);
            btn.addEventListener('mouseleave', () => {
                btn.classList.remove('active-press');
                if (pressTimer) clearTimeout(pressTimer);
            });

            btn.addEventListener('touchstart', startAction, {passive: false});
            btn.addEventListener('touchend', endAction, {passive: false});
        }

        function playStandardAudio() {
            const text = questions[currentIndex].english;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            utterance.rate = 0.9; // 稍微放慢方便模仿
            window.speechSynthesis.speak(utterance);
        }

        function updateStatsUI() {
            document.getElementById("score").innerText = score;
            document.getElementById("streak").innerText = streak;
        }

        loadQuestion();
    </script>
</body>
</html>
