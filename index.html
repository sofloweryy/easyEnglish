<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Easy English</title>
<!-- 引入 Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#FFF9F0;
font-family:"PingFang SC","Microsoft YaHei",sans-serif;
color:#403C3A
}
.app{
max-width:430px;
margin:auto;
padding:24px
}
.header{
display:flex;
justify-content:space-between;
align-items:center
}
.logo{
font-size:34px;
font-weight:900
}
.logo span{
color:#8CAFFF
}
.status{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:10px;
font-size:13px;
box-shadow:3px 3px 0 #403C3A
}
.install{
margin-top:8px;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px;
font-size:13px;
text-align:center;
cursor:pointer
}
.card{
margin-top:25px;
background:#fff;
border:2px solid #403C3A;
border-radius:30px;
padding:25px;
box-shadow:5px 5px 0 #403C3A
}
.title{
text-align:center;
color:#777;
margin-bottom:20px
}
.tabs{
display:flex;
border:2px solid #403C3A;
border-radius:18px;
overflow:hidden
}
.tabs button{
flex:1;
padding:12px;
border:0;
background:#fff;
font-weight:bold;
cursor:pointer
}
.tabs .active{
background:#EEF4FF;
color:#668FEA
}
.category{
margin:20px auto;
width:max-content;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px 14px;
font-size:13px
}
.question{
text-align:center;
font-size:24px;
font-weight:bold;
color:#8CAFFF;
margin:25px 0 10px;
line-height: 1.4;
}
.synonyms{
text-align:center;
font-size:13px;
color:#999;
margin-bottom:25px
}
.input-wrap{
position:relative
}
textarea{
width:100%;
height:90px;
border:2px solid #403C3A;
border-radius:20px;
padding:15px;
font-size:16px;
outline:none;
resize:none
}
.voice-btn{
position:absolute;
right:12px;
bottom:15px;
background:none;
border:0;
font-size:22px;
cursor:pointer;
padding:4px;
border-radius:10px;
transition:transform 0.1s
}
.voice-btn:active{
transform:scale(0.9)
}
.buttons{
display:flex;
gap:10px;
margin-top:15px
}
.buttons button{
flex:1;
padding:12px;
border-radius:18px;
border:2px solid #403C3A;
font-weight:bold;
box-shadow:3px 3px 0 #403C3A;
cursor:pointer
}
.submit{background:#F3A9BF}
.next{background:#FFE5A6}
.answer{background:#EEF4FF}
.result{
display:none;
margin-top:20px;
padding:15px;
border-radius:18px;
text-align:center
}
.result-correct{background:#EAF6EA}
.result-wrong{background:#FDEAEA}
.audio{
border:0;
background:none;
font-size:18px;
cursor:pointer
}
footer{
margin-top:25px;
display:flex;
justify-content:space-between;
gap:10px
}
footer button{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:12px;
cursor:pointer;
flex:1
}
.surprise{background:#FFF1C9}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
justify-content:center;
align-items:center;
z-index:999
}
.modal-box{
width:85%;
background:#FFF9F0;
border:2px solid #403C3A;
border-radius:28px;
padding:30px;
text-align:center
}
.wechat{
color:#07C160;
font-size:22px;
font-weight:bold
}
.modal-box button{
width:100%;
padding:14px;
border-radius:18px;
border:2px solid #403C3A;
background:#F3A9BF;
cursor:pointer;
margin-top:15px
}
.modal-box input {
width:100%;
padding:10px 12px;
margin-top:8px;
border:2px solid #403C3A;
border-radius:12px;
font-size:15px;
outline:none;
background:#FFF;
text-align:left;
}
.progress-bar{
margin-top:12px;
height:8px;
background:#eee;
border-radius:4px;
overflow:hidden
}
.progress-fill{
height:100%;
background:linear-gradient(90deg,#8CAFFF,#F3A9BF);
border-radius:4px;
transition:width 0.3s
}
.mode-tag{
display:inline-block;
background:#F3A9BF;
color:#fff;
font-size:11px;
padding:2px 8px;
border-radius:10px;
margin-left:6px;
vertical-align:middle
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">Easy <span>English</span></div>
<div>
<div class="status">
<div id="streakInfo">🔥 连续打卡 0 天</div>
<div id="starInfo">⭐ 0</div>
</div>
<div class="install" onclick="openAppPop()">📲 下载App</div>
</div>
</div>


<div class="card">

<div class="title">
每天3分钟，让英语偷偷长出来 🌱
</div>

<div class="tabs">
<button id="wordTab" class="active">🔤 单词库</button>
<button id="phraseTab">💬 短语库</button>
</div>

<div style="display:flex;justify-content:space-between;align-items:center;margin-top:15px;">
<div id="category" class="category">✨ 准备中</div>
<div id="modeTag" style="display:none;" class="mode-tag"></div>
</div>

<div id="question" class="question">正在把好玩的题目打包装箱... 🎁</div>

<div id="synonyms" class="synonyms"></div>

<div class="input-wrap">
<textarea id="input" placeholder="输入英文..."></textarea>
<button id="voiceBtn" class="voice-btn" title="长按说英文">🎤</button>
</div>

<div class="buttons">
<button class="submit" onclick="check()">✍️提交</button>
<button class="next" onclick="next()">🍃换题</button>
<button class="answer" onclick="answer()">👀答案</button>
</div>

<div id="result" class="result"></div>

<div class="progress-bar">
<div id="progressFill" class="progress-fill" style="width:0%"></div>
</div>
<div style="text-align:center;font-size:12px;color:#999;margin-top:4px;">
本轮进度：<span id="progressText">0 / 0</span>
</div>

</div>


<footer>
<button class="surprise" onclick="openPop()">✨ 点击有惊喜</button>
<button onclick="openMyPop()" id="myBtn">👤 flower</button>
</footer>

</div>


<div id="modal" class="modal">
<div class="modal-box">
<p>👀 偷偷认识美丽且智慧的开发者</p>
<p>她正在努力让英语有趣一点儿 🤣</p>
<p>
🌱 微信：
<br>
<span class="wechat">vildbloom</span>
</p>
<button onclick="closePop()">我倒是要看看</button>
</div>
</div>

<div id="appModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">📲 添加到手机桌面</p>
<p style="font-size: 14px; line-height: 1.6; color: #555;">
• <b>iOS (Safari 浏览器)</b>：<br>点击下方工具栏的"分享"按钮，然后选择 <b>"添加到主屏幕"</b>。<br><br>
• <b>Android (Chrome 浏览器)</b>：<br>点击右上角菜单按钮，选择 <b>"安装应用"</b> 或 <b>"添加到主屏幕"</b>。
</p>
<button onclick="closeAppPop()" style="margin-top: 10px;">我知道啦</button>
</div>
</div>

<div id="myModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">👤 个 人中心绑定</p>
<label style="font-size: 13px; font-weight: bold;">专属昵称：</label>
<input type="text" id="regName" placeholder="例如：flower">
<label style="font-size: 13px; font-weight: bold; display: block; margin-top: 10px;">绑定邮箱：</label>
<input type="email" id="regEmail" placeholder="your_email@domain.com">
<button id="sendEmailBtn" onclick="sendSignInEmail()" style="background:#F3A9BF;">发送邮件并绑定</button>
<button onclick="closeMyPop()" style="background:#FFE5A6; margin-top: 8px;">关闭</button>
</div>
</div>


<script>

// ========== 1. Supabase 配置 ==========
const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
const supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ========== 2. 本地备用词库（当 GitHub 的 words.json 加载失败时自动兜底） ==========
const LOCAL_BACKUP_WORDS = [
  {id:'L1',type:'word',category:'基础',question:'前天',answer:'the day before yesterday',alternatives:['two days ago']},
  {id:'L2',type:'word',category:'基础',question:'我在路上',answer:'I\'m on my way',alternatives:['I am on the way','I\'m coming']},
  {id:'L3',type:'word',category:'基础',question:'稍等一下',answer:'Just a second',alternatives:['Wait a second','Just a moment','Hold on']},
  {id:'L4',type:'word',category:'基础',question:'这怎么可能？',answer:'How is that possible?',alternatives:['How can that be?','Is that possible?']},
  {id:'L5',type:'word',category:'基础',question:'随便你',answer:'It\'s up to you',alternatives:['You decide','Whatever you want']}
];

// ========== 3. 全局变量 ==========
let type = "word"; // 'word' 或 'phrase'
let jsonPool = []; // 从 github 的 words.json 加载的题库
let questionPool = []; // 当前生效的完整题库
let current = null;
let isWrongBookMode = false;

// ========== 4. 本地存储工具函数 ==========
function getDoneIds(type) {
    try {
        return JSON.parse(localStorage.getItem(`ee_done_${type}`)) || [];
    } catch(e) { return []; }
}
function saveDoneIds(type, ids) {
    localStorage.setItem(`ee_done_${type}`, JSON.stringify(ids));
}
function getWrongBookIds(type) {
    try {
        return JSON.parse(localStorage.getItem(`ee_wrong_${type}`)) || [];
    } catch(e) { return []; }
}
function addWrongId(type, id) {
    const ids = getWrongBookIds(type);
    if (!ids.includes(String(id))) {
        ids.push(String(id));
        saveWrongIds(type, ids);
    }
}
function saveWrongIds(type, ids) {
    localStorage.setItem(`ee_wrong_${type}`, JSON.stringify(ids));
}
function getStreak() {
    try {
        const s = JSON.parse(localStorage.getItem('ee_streak')) || { count: 0, lastDate: null };
        const today = new Date().toDateString();
        if (s.lastDate !== today) {
            const yesterday = new Date(Date.now() - 86400000).toDateString();
            if (s.lastDate === yesterday) {
                s.count += 1;
            } else if (s.lastDate !== today) {
                s.count = 1;
            }
            s.lastDate = today;
            localStorage.setItem('ee_streak', JSON.stringify(s));
        }
        return s.count;
    } catch(e) { return 0; }
}
function addStar() {
    let stars = parseInt(localStorage.getItem('ee_stars') || '0');
    stars += 1;
    localStorage.setItem('ee_stars', String(stars));
    return stars;
}

function updateStats() {
    document.getElementById('streakInfo').innerHTML = `🔥 连续打卡 ${getStreak()} 天`;
    document.getElementById('starInfo').innerHTML = `⭐ ${localStorage.getItem('ee_stars') || '0'}`;
}

// ========== 5. 初始化 ==========
window.onload = function() {
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) {
        document.getElementById('myBtn').innerText = `👤 ${savedName}`;
    }
    updateStats();
    initQuestionPool();
}

// ========== 6. 核心：从 GitHub 加载 words.json 并初始化题库 ==========
async function initQuestionPool() {
    document.getElementById('category').innerHTML = "✨ 准备中";
    document.getElementById('question').innerHTML = "正在向 GitHub 获取 words.json 题库... 🎁";
    document.getElementById('modeTag').style.display = 'none';
    isWrongBookMode = false;

    try {
        // 通过 fetch 异步读取同目录下的 words.json
        const response = await fetch('words.json');
        if (!response.ok) throw new Error('网络请求 words.json 失败');
        jsonPool = await response.json();
    } catch (err) {
        console.warn("读取 words.json 失败，启用本地兜底题库", err);
        jsonPool = LOCAL_BACKUP_WORDS;
    }

    // 根据当前标签页筛选（如果你在 json 里加了 type 字段可以精准区分，如果没有则全部载入）
    questionPool = jsonPool;

    if (questionPool.length === 0) {
        document.getElementById('category').innerHTML = "⚠️ 暂无题目";
        document.getElementById('question').innerHTML = "请检查 words.json 文件内容是否为空或格式错误 📮";
        return;
    }

    document.getElementById('category').innerHTML = `📚 GitHub 题库 (${questionPool.length}题)`;
    next();
}

// ========== 7. 智能抽题函数 ==========
function next(){
    if (questionPool.length === 0) return;

    const doneIds = getDoneIds(type);
    const wrongIds = getWrongBookIds(type);

    let available = [];

    if (isWrongBookMode) {
        available = questionPool.filter((q, index) => wrongIds.includes(String(q.id || index)) && !doneIds.includes(String(q.id || index)));
    } else {
        available = questionPool.filter((q, index) => !doneIds.includes(String(q.id || index)));

        if (available.length === 0 && wrongIds.length > 0) {
            available = questionPool.filter((q, index) => wrongIds.includes(String(q.id || index)));
            if (available.length > 0) {
                document.getElementById('modeTag').style.display = 'inline-block';
                document.getElementById('modeTag').innerText = '🔥 错题复习';
            }
        }
    }

    if (available.length === 0) {
        localStorage.removeItem(`ee_done_${type}`);
        available = [...questionPool];
        if (isWrongBookMode) {
            document.getElementById('modeTag').style.display = 'inline-block';
            document.getElementById('modeTag').innerText = '🎉 错题已清空';
            isWrongBookMode = false;
        }
    }

    let randomIndex = Math.floor(Math.random() * available.length);
    current = available[randomIndex];
    current._index = questionPool.indexOf(current); // 记录题目唯一索引

    render();
    updateProgress();
}

// ========== 8. 渲染题目 ==========
function render(){
    if (!current) return;
    document.getElementById('category').innerHTML = current.category || "日常高频";
    document.getElementById('question').innerHTML = current.chinese; // 对应中文提示

    let synHtml = "";
    if (current.alternatives && current.alternatives.length > 0) {
        synHtml = "近义表达：" + current.alternatives.join(" · ");
    }
    document.getElementById('synonyms').innerHTML = synHtml;
    document.getElementById('input').value = "";
    document.getElementById('result').style.display = "none";
    document.getElementById('result').className = "result";
}

// ========== 9. 提交答案（标准答案 + 近义词智能匹配） ==========
function check(){
    let v = document.getElementById('input').value.trim();
    let result = document.getElementById('result');
    result.style.display = "block";

    if(!v){
        result.innerHTML = "⚠️ 请先输入答案或使用长按语音输入";
        result.className = "result result-wrong";
        return;
    }

    let lv = v.toLowerCase().replace(/[^a-zA-Z ]/g, "").trim();
    let correct = false;

    // 收集标准答案与近义词
    let validAnswers = [current.english];
    if (current.alternatives) {
        validAnswers.push(...current.alternatives);
    }

    correct = validAnswers.some(ans => {
        let cleanAns = ans.toLowerCase().replace(/[^a-zA-Z ]/g, "").trim();
        return lv === cleanAns;
    });

    const qId = String(current.id || current._index);

    if (correct) {
        addStar();
        updateStats();
        result.innerHTML = "✨ <b>Nice！</b> 回答正确！";
        result.className = "result result-correct";

        const doneIds = getDoneIds(type);
        if (!doneIds.includes(qId)) {
            doneIds.push(qId);
            saveDoneIds(type, doneIds);
        }
        const wrongIds = getWrongBookIds(type);
        const wrongIdx = wrongIds.indexOf(qId);
        if (wrongIdx > -1) {
            wrongIds.splice(wrongIdx, 1);
            saveWrongIds(type, wrongIds);
        }
    } else {
        result.innerHTML = `💪 再试试看！正确答案是：<b>${current.english}</b>`;
        result.className = "result result-wrong";
        addWrongId(type, qId);
    }

    updateProgress();
}

// ========== 10. 查看答案 ==========
function answer(){
    let result = document.getElementById('result');
    result.style.display = "block";
    let html = `<b>${current.english}</b> <button class="audio" onclick="speak('${current.english}')">🔊</button>`;
    if (current.alternatives && current.alternatives.length > 0) {
        html += `<br><span style="font-size:13px;color:#636E72;">也可用: ${current.alternatives.join(', ')}</span>`;
    }
    result.innerHTML = html;
    result.className = "result";
    speak(current.english);
}

// ========== 11. 进度更新 ==========
function updateProgress() {
    const doneIds = getDoneIds(type);
    const total = questionPool.length;
    const done = doneIds.length;
    document.getElementById('progressText').innerText = `${Math.min(done, total)} / ${total}`;
    document.getElementById('progressFill').style.width = `${(Math.min(done, total) / total * 100).toFixed(0)}%`;
}

// ========== 12. Tab 切换 ==========
const wordTab = document.getElementById('wordTab');
const phraseTab = document.getElementById('phraseTab');

wordTab.onclick = async () => {
    if(type === "word") return;
    type = "word";
    wordTab.classList.add("active");
    phraseTab.classList.remove("active");
    updateStats();
    await initQuestionPool();
}

phraseTab.onclick = async () => {
    if(type === "phrase") return;
    type = "phrase";
    phraseTab.classList.add("active");
    wordTab.classList.remove("active");
    updateStats();
    await initQuestionPool();
}

// ========== 13. 语音朗读 ==========
function speak(t){
    let u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
}

// ========== 14. 弹窗控制 ==========
function openPop(){ modal.style.display = "flex"; }
function closePop(){ modal.style.display = "none"; }
function openAppPop(){ document.getElementById('appModal').style.display = "flex"; }
function closeAppPop(){ document.getElementById('appModal').style.display = "none"; }
function openMyPop(){
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) document.getElementById('regName').value = savedName;
    const savedEmail = localStorage.getItem('ee_email');
    if(savedEmail) document.getElementById('regEmail').value = savedEmail;
    document.getElementById('myModal').style.display = "flex";
}
function closeMyPop(){ document.getElementById('myModal').style.display = "none"; }

// ========== 15. Supabase 登录 ==========
async function sendSignInEmail(){
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const btn = document.getElementById('sendEmailBtn');

    if(!name || !email){
        alert("⚠️ 请填写完整的昵称和邮箱！");
        return;
    }

    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
        const { error } = await supabaseApp.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: window.location.origin }
        });

        if(error) throw error;

        localStorage.setItem('ee_nickname', name);
        localStorage.setItem('ee_email', email);
        document.getElementById('myBtn').innerText = `👤 ${name}`;

        alert("✨ 验证邮件已发送！请前往您的邮箱查收，并点击邮件中的 Sign In 链接完成绑定。");
        closeMyPop();
    } catch (err) {
        alert("❌ 发送失败：" + (err.message || "请检查邮箱或网络配置"));
    } finally {
        btn.disabled = false;
        btn.innerText = "发送邮件并绑定";
    }
}

// ========== 16. 语音输入 ==========
const voiceBtn = document.getElementById('voiceBtn');
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onresult = function(e){
        document.getElementById('input').value = e.results[0][0].transcript;
    };
}

let isRecording = false;
const startVoice = (e) => {
    e.preventDefault();
    if(!recognition){
        alert("当前浏览器暂不支持语音识别功能");
        return;
    }
    if(isRecording) return;
    isRecording = true;
    voiceBtn.style.transform = "scale(0.85)";
    try{ recognition.start(); }catch(err){}
};

const stopVoice = (e) => {
    e.preventDefault();
    if(!isRecording) return;
    isRecording = false;
    voiceBtn.style.transform = "scale(1)";
    try{ recognition.stop(); }catch(err){}
};

voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', stopVoice);
voiceBtn.addEventListener('mouseleave', stopVoice);
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', stopVoice);

</script>
</body>
</html>
