<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✈️ 职场与出海口语生存模拟器</title>
    <!-- 引入手绘字体 -->
    <link href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F4F6F8;
            --card-bg: #FFFFFF;
            --border-color: #1F2937;
            --primary: #4F46E5;         /* 极客蓝/专业感 */
            --primary-hover: #4338CA;
            --accent: #10B981;          /* 成功绿 */
            --warning: #F59E0B;         /* 积分金 */
            --text-main: #1F2937;
            --shadow: 4px 4px 0px #1F2937;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 3px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--shadow);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 15px;
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive, sans-serif;
            font-size: 1.6rem;
            margin: 0 0 5px 0;
            color: var(--primary);
        }

        .subtitle {
            font-size: 0.8rem;
            color: #6B7280;
        }

        /* 登录/用户信息栏 */
        .user-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #EEF2FF;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 15px;
            font-size: 0.85rem;
        }

        .user-bar span {
            font-weight: bold;
            color: var(--primary);
        }

        .login-btn-small {
            background: var(--primary);
            color: white;
            border: none;
            padding: 4px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        /* 状态栏 */
        .stats-bar {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-badge {
            flex: 1;
            background: #FFFBEB;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            padding: 6px;
            text-align: center;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .challenge-card {
            background: #F9FAFB;
            border: 2px dashed var(--border-color);
            border-radius: 14px;
            padding: 15px;
            text-align: center;
            margin-bottom: 15px;
        }

        .tag {
            display: inline-block;
            background: #E0E7FF;
            color: var(--primary);
            border: 2px solid var(--border-color);
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .chinese-text {
            font-size: 1.15rem;
            font-weight: bold;
            line-height: 1.4;
            margin-bottom: 10px;
        }

        .hint-text {
            font-size: 0.8rem;
            color: #9CA3AF;
            margin-bottom: 15px;
        }

        .input-box {
            width: 100%;
            margin-bottom: 12px;
        }

        textarea {
            width: 100%;
            height: 65px;
            padding: 10px;
            font-size: 0.95rem;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background: #FFF;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .tool-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .circle-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            border: 2px solid var(--border-color);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-color);
        }

        .circle-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .action-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            font-family: inherit;
            font-weight: bold;
            font-size: 0.9rem;
            padding: 10px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 3px 3px 0px var(--border-color);
            background: var(--primary);
            color: #FFF;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-color);
        }

        .btn.secondary {
            background: #E5E7EB;
            color: var(--text-main);
        }

        .btn.full-width {
            grid-column: span 2;
        }

        #result {
            margin-top: 10px;
            font-size: 0.85rem;
            font-weight: bold;
            min-height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            padding: 6px;
        }

        .correct { background: #D1FAE5; color: #065F46; border: 2px solid var(--border-color); }
        .wrong { background: #FEE2E2; color: #991B1B; border: 2px solid var(--border-color); }

        /* 登录弹窗遮罩 */
        #login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border: 3px solid var(--border-color);
            border-radius: 14px;
            width: 85%;
            max-width: 320px;
            text-align: center;
            box-shadow: var(--shadow);
        }
        .modal-content input {
            width: 100%;
            padding: 8px;
            margin: 10px 0;
            border: 2px solid var(--border-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>✈️ 职场与出海口语生存</h1>
            <div class="subtitle">告别死记硬背，每日搞定真实老外场景</div>
        </div>

        <!-- 登录与云端存档栏 -->
        <div class="user-bar">
            <div>当前学习号: <span id="user-display">本地游客 (未云端同步)</span></div>
            <button class="login-btn-small" onclick="openLoginModal()" id="login-btn-text">绑定账号</button>
        </div>

        <div class="stats-bar">
            <div class="stat-badge">🔥 连击: <span id="streak">0</span></div>
            <div class="stat-badge">⭐ 积分: <span id="score">0</span></div>
        </div>

        <div class="challenge-card">
            <div id="category-badge" class="tag">载入中...</div>
            <div class="chinese-text" id="chinese-text">正在加载情境...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-box">
                <textarea id="user-input" placeholder="请输入对应的英文口语表达..." autocomplete="off"></textarea>
            </div>

            <div class="tool-buttons">
                <button class="circle-btn" onclick="speakTarget()" title="听标准发音">🔊</button>
                <button class="circle-btn" onclick="clearInput()" title="清空">🧹</button>
            </div>

            <div class="action-buttons">
                <button class="btn" onclick="checkAnswer()">提交回答 🚀</button>
                <button class="btn secondary" onclick="nextQuestion()">换一个 ➡️</button>
                <button class="btn secondary full-width" onclick="showAnswer()">偷看答案 👀</button>
            </div>
        </div>

        <div id="result"></div>
    </div>

    <!-- 简单的绑定弹窗 -->
    <div id="login-modal">
        <div class="modal-content">
            <h3>绑定你的学习账号</h3>
            <p style="font-size: 0.8rem; color:#666;">输入你的常用邮箱，开启云端积分和连击同步：</p>
            <input type="email" id="email-input" placeholder="输入邮箱 (例如 name@example.com)">
            <button class="btn" style="width:100%; margin-top:5px;" onclick="sendMagicLink()">发送登录验证链接</button>
            <button class="btn secondary" style="width:100%; margin-top:8px;" onclick="closeLoginModal()">取消</button>
        </div>
    </div>

    <script>
        // === 1. Supabase 配置 ===
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let score = 0;
        let streak = 0;

        // 页面初始化检查登录状态
        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                document.getElementById('user-display').innerText = currentUser.email.split('@')[0];
                document.getElementById('login-btn-text').innerText = '已绑定';
                loadUserDataFromCloud();
            }
        });

        function openLoginModal() {
            document.getElementById('login-modal').style.display = 'flex';
        }
        function closeLoginModal() {
            document.getElementById('login-modal').style.display = 'none';
        }

        async function sendMagicLink() {
            const email = document.getElementById('email-input').value.trim();
            if (!email) {
                alert('请输入有效的邮箱！');
                return;
            }
            const { error } = await _supabase.auth.signInWithOtp({ email });
            if (error) {
                alert('发送失败: ' + error.message);
            } else {
                alert('验证链接已发送至您的邮箱，请去邮箱点击登录！');
                closeLoginModal();
            }
        }

        // 模拟云端存档读写（你可以根据需要将 score 和 streak 存入 Supabase 用户表）
        async function loadUserDataFromCloud() {
            // 这里可以预留从 Supabase 读取用户积分的逻辑
        }

        // === 2. 题库数据 (出国旅行 + 海外工作) ===
        const questions = [
            // 旅行篇
            { category: "✈️ 旅行 · 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "提示: Where is the boarding gate..." },
            { category: "🧳 旅行 · 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "提示: air conditioner / switch rooms" },
            { category: "🍜 旅行 · 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "提示: contain peanuts / allergic" },
            { category: "🚕 旅行 · 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "提示: subway station / nearby" },

            // 工作篇
            { category: "💼 工作 · 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "提示: Can everyone hear me? / microphone" },
            { category: "💼 工作 · 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "提示: Regarding this project / thoughts" },
            { category: "💼 工作 · 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "提示: Sorry to interrupt / quick question" },
            { category: "💼 工作 · 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "提示: ahead of schedule / expect to" },
            { category: "💼 工作 · 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "提示: plate is full / might not have time" }
        ];

        let currentIndex = 0;

        function loadQuestion() {
            currentIndex = Math.floor(Math.random() * questions.length);
            const q = questions[currentIndex];
            document.getElementById("category-badge").innerText = q.category;
            document.getElementById("chinese-text").innerHTML = `“${q.chinese}”`;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            document.getElementById("result").innerHTML = "";
            document.getElementById("result").className = "";
        }

        function checkAnswer() {
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = questions[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultDiv = document.getElementById("result");

            if (!cleanUser) {
                resultDiv.className = "wrong";
                resultDiv.innerText = "⚠️ 请先输入你的英文回答哦！";
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length > 5 && cleanTarget.includes(cleanUser))) {
                score += 10;
                streak += 1;
                resultDiv.className = "correct";
                resultDiv.innerHTML = "🎉 回答完美！生存挑战成功 +10 分！";
                setTimeout(nextQuestion, 1500);
            } else {
                streak = 0;
                resultDiv.className = "wrong";
                resultDiv.innerHTML = `❌ 差一点点！正确参考：<br><b>${questions[currentIndex].english}</b>`;
            }
            updateStats();
        }

        function showAnswer() {
            const resultDiv = document.getElementById("result");
            resultDiv.className = "wrong";
            resultDiv.innerHTML = `💡 参考答案：<br><b>${questions[currentIndex].english}</b>`;
            streak = 0;
            updateStats();
        }

        function nextQuestion() {
            loadQuestion();
        }

        function clearInput() {
            document.getElementById("user-input").value = "";
            document.getElementById("user-input").focus();
        }

        function speakTarget() {
            const text = questions[currentIndex].english;
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            window.speechSynthesis.speak(utterance);
        }

        function updateStats() {
            document.getElementById("score").innerText = score;
            document.getElementById("streak").innerText = streak;
        }

        // 初始化
        loadQuestion();
    </script>
</body>
</html>
