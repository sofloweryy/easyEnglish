<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Easy English</title>
<!-- 引入 Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{
margin:0;
background:#FFF9F0;
font-family:"PingFang SC","Microsoft YaHei",sans-serif;

}

.header{

.logo span{

.status{

}
.install{
margin-top:8px;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px;
font-size:13px;
text-align:center;
cursor:pointer
}
.card{
margin-top:25px;
background:#fff;
border:2px solid #403C3A;
border-radius:30px;
padding:25px;
box-shadow:5px 5px 0 #403C3A
}
.title{
text-align:center;
color:#777;
margin-bottom:20px
}
.tabs{
display:flex;
border:2px solid #403C3A;
border-radius:18px;
overflow:hidden
}
.tabs button{
flex:1;
padding:12px;
border:0;
background:#fff;
font-weight:bold;
cursor:pointer
}
.tabs .active{
background:#EEF4FF;
color:#668FEA
}
.category{
margin:20px auto;
width:max-content;
background:#FFE5A6;
border:2px solid #403C3A;
border-radius:15px;
padding:6px 14px;
font-size:13px
}
.question{
text-align:center;
font-size:24px;
font-weight:bold;
color:#8CAFFF;
margin:25px 0 10px;
line-height: 1.4;
}
.synonyms{
text-align:center;
font-size:13px;
color:#999;
margin-bottom:25px
}
.input-wrap{
position:relative
}
textarea{
width:100%;
height:90px;
border:2px solid #403C3A;
border-radius:20px;
padding:15px;
font-size:16px;
outline:none;
resize:none
}
.voice-btn{
position:absolute;
right:12px;
bottom:15px;
background:none;
border:0;
font-size:22px;
cursor:pointer;
padding:4px;
border-radius:10px;
transition:transform 0.1s
}
.voice-btn:active{
transform:scale(0.9)
}
.buttons{
display:flex;
gap:10px;
margin-top:15px
}
.buttons button{
flex:1;
padding:12px;
border-radius:18px;
border:2px solid #403C3A;
font-weight:bold;
box-shadow:3px 3px 0 #403C3A;
cursor:pointer
}
.submit{background:#F3A9BF}
.next{background:#FFE5A6}
.answer{background:#EEF4FF}
.result{
display:none;
margin-top:20px;
background:#EAF6EA;
padding:15px;
border-radius:18px;
text-align:center
}
.audio{
border:0;
background:none;
font-size:18px;
cursor:pointer
}
footer{
margin-top:25px;
display:flex;
justify-content:space-between
}
footer button{
background:#fff;
border:2px solid #403C3A;
border-radius:18px;
padding:12px;
cursor:pointer
}
.surprise{
background:#FFF1C9
}
.modal{
display:none;
position:fixed;
inset:0;
background:rgba(0,0,0,.4);
justify-content:center;
align-items:center;
z-index:999
}
.modal-box{
width:85%;
background:#FFF9F0;
border:2px solid #403C3A;
border-radius:28px;
padding:30px;
text-align:center
}
.wechat{
color:#07C160;
font-size:22px;
font-weight:bold
}
.modal-box button{
width:100%;
padding:14px;
border-radius:18px;
border:2px solid #403C3A;
background:#F3A9BF;
cursor:pointer;
margin-top:15px
}
.modal-box input {
width:100%;
padding:10px 12px;
margin-top:8px;
border:2px solid #403C3A;
border-radius:12px;
font-size:15px;
outline:none;
background:#FFF;
text-align:left;
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="logo">Easy <span>English</span></div>
<div>
<div class="status">🔥 连续打卡<br>⭐120</div>
<div class="install" onclick="openAppPop()">📲 下载App</div>
</div>
</div>


<div class="card">

<div class="title">
每天3分钟，让英语偷偷长出来 🌱
</div>

<div class="tabs">
<button id="wordTab" class="active">🔤 单词</button>
<button id="phraseTab">💬 短语</button>
</div>

<div id="category" class="category"></div>

<div id="question" class="question"></div>

<div id="synonyms" class="synonyms"></div>

<div class="input-wrap">
<textarea id="input" placeholder="输入英文..."></textarea>
<button id="voiceBtn" class="voice-btn" title="长按说英文">🎤</button>
</div>

<div class="buttons">
<button class="submit" onclick="check()">✍️提交</button>
<button class="next" onclick="next()">🍃换题</button>
<button class="answer" onclick="answer()">👀答案</button>
</div>

<div id="result" class="result"></div>

</div>


<footer>
<button class="surprise" onclick="openPop()">✨ 点击有惊喜</button>
<button onclick="openMyPop()" id="myBtn">👤 我的</button>
</footer>

</div>


<div id="modal" class="modal">
<div class="modal-box">
<p>👀 偷偷认识美丽且智慧的开发者</p>
<p>她正在努力让英语有趣一点儿 🤣</p>
<p>
🌱 微信：
<br>
<span class="wechat">vildbloom</span>
</p>
<button onclick="closePop()">我倒是要看看</button>
</div>
</div>

<div id="appModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">📲 添加到手机桌面</p>
<p style="font-size: 14px; line-height: 1.6; color: #555;">
• <b>iOS (Safari 浏览器)</b>：<br>点击下方工具栏的“分享”按钮，然后选择 <b>“添加到主屏幕”</b>。<br><br>
• <b>Android (Chrome 浏览器)</b>：<br>点击右上角菜单按钮，选择 <b>“安装应用”</b> 或 <b>“添加到主屏幕”</b>。
</p>
<button onclick="closeAppPop()" style="margin-top: 10px;">我知道啦</button>
</div>
</div>

<div id="myModal" class="modal">
<div class="modal-box" style="text-align: left;">
<p style="text-align: center; font-weight: bold; font-size: 18px; margin-top:0;">👤 个人中心绑定</p>
<label style="font-size: 13px; font-weight: bold;">专属昵称：</label>
<input type="text" id="regName" placeholder="例如：flower">
<label style="font-size: 13px; font-weight: bold; display: block; margin-top: 10px;">绑定邮箱：</label>
<input type="email" id="regEmail" placeholder="your_email@domain.com">
<button id="sendEmailBtn" onclick="sendSignInEmail()" style="background:#F3A9BF;">发送邮件并绑定</button>
<button onclick="closeMyPop()" style="background:#FFE5A6; margin-top: 8px;">关闭</button>
</div>
</div>


<script>

// 初始化 Supabase 客户端
const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
const supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.onload = function() {
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName){
        document.getElementById('myBtn').innerText = `👤 ${savedName}`;
    }
}

// 精选高质量单词和短语题库（确保每一题都地道准确）
const words=[
{ id: 1, category: "✈️旅行", question: "登机口", answer: "boarding gate", phonetic: "/ˈbɔːrdɪŋ ɡeɪt/", synonyms: ["gate", "boarding area"] },
{ id: 2, category: "💼商务工作", question: "截止日期", answer: "deadline", phonetic: "/ˈdedlaɪn/", synonyms: ["due date", "time limit"] },
{ id: 3, category: "🎵音乐文化", question: "歌词", answer: "lyrics", phonetic: "/ˈlɪrɪks/", synonyms: ["words", "text"] },
{ id: 4, category: "☕️日常口语", question: "尴尬的", answer: "awkward", phonetic: "/ˈɔːkwərd/", synonyms: ["embarrassing", "uncomfortable"] },
{ id: 5, category: "☕️日常口语", question: "咖啡因", answer: "caffeine", phonetic: "/ˈkæfiːn/", synonyms: ["coffee essence"] },
{ id: 6, category: "✈️旅行", question: "行李提取处", answer: "baggage claim", phonetic: "/ˈbæɡɪdʒ kleɪm/", synonyms: ["luggage pickup"] },
{ id: 7, category: "💼商务工作", question: "头脑风暴", answer: "brainstorming", phonetic: "/ˈbreɪnˌstɔːrmɪŋ/", synonyms: ["idea generation"] },
{ id: 8, category: "🎵音乐文化", question: "流媒体", answer: "streaming media", phonetic: "/ˈstriːmɪŋ ˈmiːdiə/", synonyms: ["digital broadcast"] },
{ id: 9, category: "❤️社交", question: "灵魂伴侣", answer: "soulmate", phonetic: "/ˈsəʊlmeɪt/", synonyms: ["kindred spirit"] },
{ id: 10, category: "☕️日常口语", question: "拖延症", answer: "procrastination", phonetic: "/prəˌkræstɪˈneɪʃn/", synonyms: ["delaying tactics"] },
{ id: 11, category: "💡科技生活", question: "人工智能", answer: "artificial intelligence", phonetic: "/ˌɑːrtɪfɪʃl ɪnˈtelɪdʒəns/", synonyms: ["AI"] },
{ id: 12, category: "💼商务工作", question: "创新", answer: "innovation", phonetic: "/ˌɪnəˈveɪʃn/", synonyms: ["novelty", "creativity"] },
{ id: 13, category: "🎨艺术美学", question: "灵感", answer: "inspiration", phonetic: "/ˌɪnspəˈreɪʃn/", synonyms: ["flash", "muse"] },
{ id: 14, category: "☕️日常口语", question: "专注", answer: "concentration", phonetic: "/ˌkɒnsnˈtreɪʃn/", synonyms: ["focus", "attention"] },
{ id: 15, category: "❤️社交", question: "和谐", answer: "harmony", phonetic: "/ˈhɑːməni/", synonyms: ["balance", "accord"] }
];

const phrases=[
{ id: 101, category: "✈️旅行", question: "请问去机场怎么走？", answer: "How can I get to the airport?" },
{ id: 102, category: "💼商务工作", question: "我们之后同步一下进展。", answer: "Let's sync up later." },
{ id: 103, category: "❤️社交", question: "你最近过得怎么样？", answer: "How have you been lately?" },
{ id: 104, category: "☕️日常口语", question: "今天天气真不错。", answer: "The weather is really nice today." },
{ id: 105, category: "💼商务工作", question: "我们能把会议推迟到明天吗？", answer: "Could we reschedule the meeting to tomorrow?" },
{ id: 106, category: "🎵音乐文化", question: "这首歌太洗脑了。", answer: "This song is so catchy." },
{ id: 107, category: "☕️日常口语", question: "我有点累了想休息。", answer: "I'm kind of tired and want to rest." },
{ id: 108, category: "❤️社交", question: "有什么我可以帮您的吗？", answer: "Is there anything I can help you with?" },
{ id: 109, category: "💼商务工作", question: "让我们开始吧！", answer: "Let's get started!" },
{ id: 110, category: "☕️日常口语", question: "保持联系。", answer: "Keep in touch." },
{ id: 111, category: "💡科技生活", question: "这太不可思议了！", answer: "This is unbelievable!" },
{ id: 112, category: "✈️旅行", question: "我想预定一张票。", answer: "I would like to book a ticket." }
];

let type = "word";
let current;

function getUsedStorageKey() {
    return type === "word" ? "ee_used_words_v2" : "ee_used_phrases_v2";
}

function pool(){
    return type === "word" ? words : phrases;
}

function next(){
    let used = JSON.parse(localStorage.getItem(getUsedStorageKey()) || "[]");
    let currentPool = pool();
    
    // 过滤掉已经做过的题目
    let list = currentPool.filter(x => !used.includes(x.id));

    // 如果当前分类题目全部做完，自动清空重置，开启新的一轮
    if(!list.length){
        used = [];
        localStorage.setItem(getUsedStorageKey(), JSON.stringify(used));
        list = currentPool;
    }

    // 随机抽题
    current = list[Math.floor(Math.random() * list.length)];

    // 记录已做
    used.push(current.id);
    localStorage.setItem(getUsedStorageKey(), JSON.stringify(used));

    render();
}

function render(){
    category.innerHTML = current.category;
    question.innerHTML = current.question;
    synonyms.innerHTML = (type === "word" ? "近义词：" + current.synonyms.join(" · ") : "");
    input.value = "";
    result.style.display = "none";
}

wordTab.onclick = () => {
    type = "word";
    wordTab.classList.add("active");
    phraseTab.classList.remove("active");
    next();
}

phraseTab.onclick = () => {
    type = "phrase";
    phraseTab.classList.add("active");
    wordTab.classList.remove("active");
    next();
}

function answer(){
    result.style.display = "block";
    if(type === "word"){
        result.innerHTML = `<b>${current.answer}</b> &nbsp; ${current.phonetic} <button class="audio" onclick="speak('${current.answer}')">🔊</button>`;
    } else {
        result.innerHTML = `<b>${current.answer}</b>`;
    }
}

function check(){
    let v = input.value.trim();
    result.style.display = "block";
    if(!v){
        result.innerHTML = "⚠️ 请先输入答案或使用长按语音输入";
        return;
    }
    let lv = v.toLowerCase();
    result.innerHTML = current.answer.toLowerCase().includes(lv) ? "✨ Nice！" : "💡 再试试看";
}

function speak(t){
    let u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
}

function openPop(){ modal.style.display = "flex"; }
function closePop(){ modal.style.display = "none"; }
function openAppPop(){ document.getElementById('appModal').style.display = "flex"; }
function closeAppPop(){ document.getElementById('appModal').style.display = "none"; }
function openMyPop(){
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) document.getElementById('regName').value = savedName;
    const savedEmail = localStorage.getItem('ee_email');
    if(savedEmail) document.getElementById('regEmail').value = savedEmail;
    document.getElementById('myModal').style.display = "flex";
}
function closeMyPop(){ document.getElementById('myModal').style.display = "none"; }

async function sendSignInEmail(){
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const btn = document.getElementById('sendEmailBtn');

    if(!name || !email){
        alert("⚠️ 请填写完整的昵称和邮箱！");
        return;
    }

    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
        const { error } = await supabaseApp.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: window.location.origin }
        });

        if(error) throw error;

        localStorage.setItem('ee_nickname', name);
        localStorage.setItem('ee_email', email);
        document.getElementById('myBtn').innerText = `👤 ${name}`;

        alert("✨ 验证邮件已发送！请前往您的邮箱查收，并点击邮件中的 Sign In 链接完成绑定。");
        closeMyPop();
    } catch (err) {
        alert("❌ 发送失败：" + (err.message || "请检查邮箱或网络配置"));
    } finally {
        btn.disabled = false;
        btn.innerText = "发送邮件并绑定";
    }
}

// 长按语音输入逻辑
const voiceBtn = document.getElementById('voiceBtn');
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onresult = function(e){
        input.value = e.results[0][0].transcript;
    };
}

let isRecording = false;
const startVoice = (e) => {
    e.preventDefault();
    if(!recognition){
        alert("当前浏览器暂不支持语音识别功能");
        return;
    }
    if(isRecording) return;
    isRecording = true;
    voiceBtn.style.transform = "scale(0.85)";
    try{ recognition.start(); }catch(err){}
};

const stopVoice = (e) => {
    e.preventDefault();
    if(!isRecording) return;
    isRecording = false;
    voiceBtn.style.transform = "scale(1)";
    try{ recognition.stop(); }catch(err){}
};

voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', stopVoice);
voiceBtn.addEventListener('mouseleave', stopVoice);
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', stopVoice);

// 初始化第一题
next();

</script>

</body>
</html>
