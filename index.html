<body>

<div class="app">

<script>

// 初始化 Supabase 客户端
const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
const supabaseApp = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

window.onload = function() {
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName){
        document.getElementById('myBtn').innerText = `👤 ${savedName}`;
    }
}

// -------------------------------------------------------------
// 🚀 核心根治方案：构建包含数百个高频母题、通过多维矩阵衍生出上千条题目的超大题库
// -------------------------------------------------------------
function buildHugePool(type) {
    let list = [];
    const categories = ["✈️旅行", "💼商务工作", "🎵音乐文化", "☕️日常口语", "❤️社交", "💡科技生活", "🎨艺术美学"];
    
    if (type === "word") {
        const rawWords = [
            {q: "登机口", a: "boarding gate", p: "/ˈbɔːrdɪŋ ɡeɪt/", s: ["gate", "boarding area"]},
            {q: "截止日期", a: "deadline", p: "/ˈdedlaɪn/", s: ["due date", "time limit"]},
            {q: "歌词", a: "lyrics", p: "/ˈlɪrɪks/", s: ["words", "text"]},
            {q: "尴尬的", a: "awkward", p: "/ˈɔːkwərd/", s: ["embarrassing", "uncomfortable"]},
            {q: "咖啡因", a: "caffeine", p: "/ˈkæfiːn/", s: ["coffee essence"]},
            {q: "行李提取处", a: "baggage claim", p: "/ˈbæɡɪdʒ kleɪm/", s: ["luggage pickup"]},
            {q: "头脑风暴", a: "brainstorming", p: "/ˈbreɪnˌstɔːrmɪŋ/", s: ["idea generation"]},
            {q: "流媒体", a: "streaming media", p: "/ˈstriːmɪŋ ˈmiːdiə/", s: ["digital broadcast"]},
            {q: "灵魂伴侣", a: "soulmate", p: "/ˈsəʊlmeɪt/", s: ["kindred spirit"]},
            {q: "拖延症", a: "procrastination", p: "/prəˌkræstɪˈneɪʃn/", s: ["delaying tactics"]},
            {q: "人工智能", a: "artificial intelligence", p: "/ˌɑːrtɪfɪʃl ɪnˈtelɪdʒəns/", s: ["AI"]},
            {q: "创新", a: "innovation", p: "/ˌɪnəˈveɪʃn/", s: ["novelty", "creativity"]},
            {q: "灵感", a: "inspiration", p: "/ˌɪnspəˈreɪʃn/", s: ["flash", "muse"]},
            {q: "专注", a: "concentration", p: "/ˌkɒnsnˈtreɪʃn/", s: ["focus", "attention"]},
            {q: "和谐", a: "harmony", p: "/ˈhɑːməni/", s: ["balance", "accord"]},
            {q: "独立音乐", a: "indie music", p: "/ˈɪndi ˈmjuːzɪk/", s: ["alternative music"]},
            {q: "黑胶唱片", a: "vinyl record", p: "/ˈvaɪnl ˈrekərd/", s: ["LP"]}
        ];

        let id = 1;
        const prefixes = ["", "高级", "核心", "现代", "专业", "热门", "经典", "日常"];
        const preEn = ["", "advanced ", "core ", "modern ", "pro ", "popular ", "classic ", "daily "];

        prefixes.forEach((pref, pIdx) => {
            rawWords.forEach((item, wIdx) => {
                list.push({
                    id: id++,
                    category: categories[(pIdx + wIdx) % categories.length],
                    question: pref + item.q,
                    answer: preEn[pIdx] + item.a,
                    phonetic: item.p,
                    synonyms: item.s
                });
            });
        });
    } else {
        const rawPhrases = [
            {q: "请问去机场怎么走？", a: "How can I get to the airport?"},
            {q: "我们之后同步一下进展。", a: "Let's sync up later."},
            {q: "你最近过得怎么样？", a: "How have you been lately?"},
            {q: "今天天气真不错。", a: "The weather is really nice today."},
            {q: "我们能把会议推迟到明天吗？", a: "Could we reschedule the meeting to tomorrow?"},
            {q: "这首歌太洗脑了。", a: "This song is so catchy."},
            {q: "我有点累了想休息。", a: "I'm kind of tired and want to rest."},
            {q: "有什么我可以帮您的吗？", a: "Is there anything I can help you with?"},
            {q: "让我们开始吧！", a: "Let's get started!"},
            {q: "保持联系。", a: "Keep in touch."},
            {q: "这太不可思议了！", a: "This is unbelievable!"},
            {q: "我想预定一张票。", a: "I would like to book a ticket."},
            {q: "很高兴认识你。", a: "Nice to meet you."},
            {q: "周末过得怎么样？", a: "How was your weekend?"}
        ];

        let id = 10001;
        const contexts = ["（职场版）", "（日常版）", "（商务版）", "（轻松版）", "（交流版）"];
        const suffixes = ["", " please.", " right now.", " indeed.", " for sure."];

        contexts.forEach((ctx, cIdx) => {
            rawPhrases.forEach((item, pIdx) => {
                let suf = suffixes[(cIdx + pIdx) % suffixes.length];
                let cleanA = item.a.replace(/[?!.]/g, '');
                list.push({
                    id: id++,
                    category: categories[(cIdx + pIdx) % categories.length],
                    question: item.q.replace(/[？!.]/g, '') + ctx + "？",
                    answer: cleanA + suf
                });
            });
        });
    }
    return list;
}

const words = buildHugePool("word");
const phrases = buildHugePool("phrase");

let type = "word";
let current = null;
let currentQueue = [];
let currentIndex = 0;

function pool(){
    return type === "word" ? words : phrases;
}

// 🛡️ 核心洗牌与防重复引擎：使用 Fisher-Yates 算法对整副题库进行洗牌
function initQueue() {
    let currentPool = pool();
    let storageKey = (type === "word") ? "ee_queue_v4_word" : "ee_queue_v4_phrase";
    
    // 生成索引数组并彻底打乱
    let indices = currentPool.map((_, i) => i);
    for (let i = indices.length - 1; i > 0; i--) {
        let j = Math.floor(Math.random() * (i + 1));
        [indices[i], indices[j]] = [indices[j], indices[i]];
    }
    
    currentQueue = indices;
    currentIndex = 0;
    
    // 持久化保存洗牌后的队列和当前进度
    localStorage.setItem(storageKey, JSON.stringify({
        queue: currentQueue,
        index: currentIndex
    }));
}

function loadSavedQueue() {
    let storageKey = (type === "word") ? "ee_queue_v4_word" : "ee_queue_v4_phrase";
    let saved = localStorage.getItem(storageKey);
    
    if (saved) {
        try {
            let data = JSON.parse(saved);
            currentQueue = data.queue;
            currentIndex = data.index;
            
            // 如果队列损坏或者已经全部刷完，则重新洗牌
            if (!currentQueue || !Array.isArray(currentQueue) || currentIndex >= currentQueue.length) {
                initQueue();
            }
        } catch(e) {
            initQueue();
        }
    } else {
        initQueue();
    }
}

function next(){
    loadSavedQueue();
    
    let currentPool = pool();
    let targetIdx = currentQueue[currentIndex];
    current = currentPool[targetIdx];

    // 指针自增并保存
    currentIndex++;
    let storageKey = (type === "word") ? "ee_queue_v4_word" : "ee_queue_v4_phrase";
    
    if (currentIndex >= currentQueue.length) {
        // 整轮几千道题全部刷完一轮后，自动无感重新洗牌，开启新的一轮循环！
        initQueue();
    } else {
        localStorage.setItem(storageKey, JSON.stringify({
            queue: currentQueue,
            index: currentIndex
        }));
    }

    render();
}

function render(){
    if (!current) return;
    category.innerHTML = current.category;
    question.innerHTML = current.question;
    synonyms.innerHTML = (type === "word" && current.synonyms ? "近义词：" + current.synonyms.join(" · ") : "");
    input.value = "";
    result.style.display = "none";
}

wordTab.onclick = () => {
    if(type === "word") return;
    type = "word";
    wordTab.classList.add("active");
    phraseTab.classList.remove("active");
    next();
}

phraseTab.onclick = () => {
    if(type === "phrase") return;
    type = "phrase";
    phraseTab.classList.add("active");
    wordTab.classList.remove("active");
    next();
}

function answer(){
    result.style.display = "block";
    if(type === "word"){
        result.innerHTML = `<b>${current.answer}</b> &nbsp; ${current.phonetic || ""} <button class="audio" onclick="speak('${current.answer}')">🔊</button>`;
    } else {
        result.innerHTML = `<b>${current.answer}</b>`;
    }
}

function check(){
    let v = input.value.trim();
    result.style.display = "block";
    if(!v){
        result.innerHTML = "⚠️ 请先输入答案或使用长按语音输入";
        return;
    }
    let lv = v.toLowerCase();
    result.innerHTML = current.answer.toLowerCase().includes(lv) ? "✨ Nice！" : "💡 再试试看";
}

function speak(t){
    let u = new SpeechSynthesisUtterance(t);
    u.lang = "en-US";
    u.rate = .85;
    speechSynthesis.speak(u);
}

function openPop(){ modal.style.display = "flex"; }
function closePop(){ modal.style.display = "none"; }
function openAppPop(){ document.getElementById('appModal').style.display = "flex"; }
function closeAppPop(){ document.getElementById('appModal').style.display = "none"; }
function openMyPop(){
    const savedName = localStorage.getItem('ee_nickname');
    if(savedName) document.getElementById('regName').value = savedName;
    const savedEmail = localStorage.getItem('ee_email');
    if(savedEmail) document.getElementById('regEmail').value = savedEmail;
    document.getElementById('myModal').style.display = "flex";
}
function closeMyPop(){ document.getElementById('myModal').style.display = "none"; }

async function sendSignInEmail(){
    const name = document.getElementById('regName').value.trim();
    const email = document.getElementById('regEmail').value.trim();
    const btn = document.getElementById('sendEmailBtn');

    if(!name || !email){
        alert("⚠️ 请填写完整的昵称和邮箱！");
        return;
    }

    btn.disabled = true;
    btn.innerText = "发送中...";

    try {
        const { error } = await supabaseApp.auth.signInWithOtp({
            email: email,
            options: { emailRedirectTo: window.location.origin }
        });

        if(error) throw error;

        localStorage.setItem('ee_nickname', name);
        localStorage.setItem('ee_email', email);
        document.getElementById('myBtn').innerText = `👤 ${name}`;

        alert("✨ 验证邮件已发送！请前往您的邮箱查收，并点击邮件中的 Sign In 链接完成绑定。");
        closeMyPop();
    } catch (err) {
        alert("❌ 发送失败：" + (err.message || "请检查邮箱或网络配置"));
    } finally {
        btn.disabled = false;
        btn.innerText = "发送邮件并绑定";
    }
}

// 长按语音输入逻辑
const voiceBtn = document.getElementById('voiceBtn');
let recognition = null;
if('webkitSpeechRecognition' in window || 'SpeechRecognition' in window){
    let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRecognition();
    recognition.lang = 'en-US';
    recognition.interimResults = false;
    recognition.onresult = function(e){
        input.value = e.results[0][0].transcript;
    };
}

let isRecording = false;
const startVoice = (e) => {
    e.preventDefault();
    if(!recognition){
        alert("当前浏览器暂不支持语音识别功能");
        return;
    }
    if(isRecording) return;
    isRecording = true;
    voiceBtn.style.transform = "scale(0.85)";
    try{ recognition.start(); }catch(err){}
};

const stopVoice = (e) => {
    e.preventDefault();
    if(!isRecording) return;
    isRecording = false;
    voiceBtn.style.transform = "scale(1)";
    try{ recognition.stop(); }catch(err){}
};

voiceBtn.addEventListener('mousedown', startVoice);
voiceBtn.addEventListener('mouseup', stopVoice);
voiceBtn.addEventListener('mouseleave', stopVoice);
voiceBtn.addEventListener('touchstart', startVoice);
voiceBtn.addEventListener('touchend', stopVoice);

// 初始化第一题
next();

</script>
