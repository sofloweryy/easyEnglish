<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ Easy English ✦</title>
    <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Serif+SC:wght@700&family=Quicksand:wght@600;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --bg-color: #FAF6ED;
            --card-bg: #FFFFFF;
            --border-dark: #2C2A29;
            --accent-terracotta: #E07A5F;
            --text-main: #2C2A29;
            --text-muted: #8C8275;
            --font-handwriting: 'ZCOOL KuaiLe', cursive, sans-serif;
            --font-title-hand: 'Ma Shan Zheng', cursive, sans-serif;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: var(--font-handwriting);
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 12px 10px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 28px 22px 24px 24px;
            border: 2.5px solid var(--border-dark);
            padding: 16px 14px;
            box-shadow: 5px 7px 0px rgba(44, 42, 41, 0.85);
            position: relative;
        }

        /* 顶部区域：标题与右上角统计数据 */
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .brand-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
            text-shadow: 2px 2px 0px #FFE5EC;
            line-height: 1.2;
        }

        /* 右上角：打卡与积分 */
        .stats-badge-top {
            background: #FFF1F2;
            border: 2px solid var(--border-dark);
            padding: 4px 8px;
            border-radius: 10px;
            box-shadow: 2px 2px 0px var(--border-dark);
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 1px;
            align-items: flex-end;
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
        }

        .mode-switch-bar {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
            background: #F3EFEA;
            padding: 4px;
            border-radius: 12px;
            border: 2px solid var(--border-dark);
        }

        .mode-tab {
            background: transparent;
            border: none;
            font-family: var(--font-handwriting);
            font-size: 1.1rem;
            padding: 6px 0;
            border-radius: 8px;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.1s ease;
        }

        .mode-tab.active {
            background: #FFFFFF;
            color: var(--text-main);
            border: 1.5px solid var(--border-dark);
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
        }

        /* 题目卡片 */
        .sketch-card {
            background: #FFFCF7;
            border: 2px dashed #E6DEC9;
            border-radius: 16px;
            padding: 14px 12px 12px 12px;
            text-align: center;
            margin-bottom: 8px;
            position: relative;
        }

        .category-pill {
            display: inline-block;
            background: #E8F5E9;
            color: #2E7D32;
            border: 2px solid var(--border-dark);
            padding: 2px 14px;
            border-radius: 16px;
            font-size: 1.05rem;
            margin-bottom: 6px;
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        .chinese-prompt {
            font-family: var(--font-title-hand);
            font-size: 1.6rem;
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 6px;
            color: var(--text-main);
        }

        .hint-text {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 10px;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
        }

        .input-container-wrapper {
            position: relative;
            margin-bottom: 6px;
        }

        textarea {
            width: 100%;
            height: 64px;
            padding: 8px 38px 8px 10px;
            font-size: 1.15rem;
            font-family: 'Quicksand', sans-serif;
            font-weight: 600;
            border: 2px solid var(--border-dark);
            border-radius: 12px;
            background: #FFFFFF;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            user-select: text;
        }

        textarea::placeholder {
            font-family: var(--font-handwriting);
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        textarea:focus {
            border-color: var(--accent-terracotta);
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .inline-tools {
            position: absolute;
            right: 8px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mini-tool-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.95rem;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            transition: all 0.08s ease;
        }

        .mini-tool-btn:active, .mini-tool-btn.recording {
            transform: translate(1px, 1px);
            box-shadow: none;
            background: #FF8FA3;
            color: white;
        }

        .voice-status-tip {
            font-size: 0.95rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            height: 20px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1fr;
            gap: 6px;
            margin-bottom: 10px;
        }

        .sketch-btn {
            font-family: var(--font-handwriting);
            font-size: 1.15rem;
            padding: 8px 4px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-dark);
            transition: all 0.08s ease;
            background: #FFFFFF;
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 3px;
            white-space: nowrap;
        }

        .sketch-btn:active {
            transform: translate(1.5px, 1.5px);
            box-shadow: 0.5px 0.5px 0px var(--border-dark);
        }

        .sketch-btn.primary {
            background: #2C2A29;
            color: #FFFFFF;
        }

        /* 卡片右下角：昵称与设置 */
        .card-footer-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 8px;
            padding-top: 6px;
            border-top: 1.5px dashed #E6DEC9;
        }

        .user-tag-bottom {
            font-size: 0.95rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .user-tag-bottom span {
            color: var(--accent-terracotta);
            font-weight: 700;
        }

        .login-mini-btn {
            background: #FFE5EC;
            color: var(--border-dark);
            border: 1.5px solid var(--border-dark);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            font-family: var(--font-handwriting);
        }
        .login-mini-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        #result-box {
            margin-top: 8px;
            font-size: 1.15rem;
            font-family: var(--font-handwriting);
            min-height: 42px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 10px;
            padding: 6px 10px;
            text-align: left;
            border: 2px solid var(--border-dark);
            box-shadow: 2.5px 2.5px 0px var(--border-dark);
            gap: 6px;
        }

        .feedback-success { background: #E8F5E9; color: #2E7D32; }
        .feedback-error { background: #FFEBEE; color: #C62828; }

        .answer-audio-btn {
            background: #FFF;
            border: 1.5px solid var(--border-dark);
            border-radius: 6px;
            padding: 2px 6px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 1.5px 1.5px 0px var(--border-dark);
            white-space: nowrap;
            flex-shrink: 0;
            font-family: var(--font-handwriting);
        }
        .answer-audio-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
            background: #FFE5EC;
        }

        .surprise-btn {
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            background: #FFF5F7;
            color: var(--accent-terracotta);
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 10px;
            font-family: var(--font-handwriting);
            font-size: 1.3rem;
            cursor: pointer;
            box-shadow: 3px 4px 0px var(--border-dark);
            transition: all 0.08s ease;
            text-align: center;
        }
        .surprise-btn:active {
            transform: translate(1.5px, 1.5px);
            box-shadow: 1px 1.5px 0px var(--border-dark);
        }

        /* 底部常驻下载引导条（当天第二次进入时显示） */
        .bottom-install-banner {
            display: none;
            width: 100%;
            max-width: 420px;
            margin-top: 10px;
            background: #FFFCF7;
            border: 2px solid var(--border-dark);
            border-radius: 14px;
            padding: 10px 14px;
            box-shadow: 3px 4px 0px var(--border-dark);
            align-items: center;
            justify-content: space-between;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 42, 41, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #FFFCF7;
            border: 2.5px solid var(--border-dark);
            border-radius: 20px;
            padding: 16px;
            width: 90%;
            max-width: 320px;
            box-shadow: 5px 7px 0px var(--border-dark);
            text-align: left;
            font-family: var(--font-handwriting);
        }

        .modal-card h3 {
            margin: 0 0 4px 0;
            font-size: 1.6rem;
            text-align: center;
            font-family: var(--font-title-hand);
        }

        .modal-card label {
            display: block;
            font-size: 1.05rem;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .modal-card input {
            width: 100%;
            padding: 6px 10px;
            margin-top: 2px;
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            font-family: 'Quicksand', sans-serif;
            font-size: 1.05rem;
            outline: none;
            background: #FFF;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部：品牌名与右上角统计 -->
        <div class="header-area">
            <div class="brand-title">Easy English</div>
            <div class="stats-badge-top">
                <div>🔥 打卡: <span id="streak">1</span> 天</div>
                <div>⭐ 积分: <span id="score">10</span> 分</div>
            </div>
        </div>

        <div class="mode-switch-bar">
            <button class="mode-tab active" id="tab-word" onclick="switchMode('word')">🔤 高频单词</button>
            <button class="mode-tab" id="tab-phrase" onclick="switchMode('phrase')">💬 常用短语</button>
        </div>

        <!-- 核心题目卡片 -->
        <div class="sketch-card">
            <div id="category-pill" class="category-pill">🔥 载入中...</div>
            <div class="chinese-prompt" id="chinese-text">正在翻阅手帐页面...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-container-wrapper">
                <textarea id="user-input" placeholder="请在此输入英文..." autocomplete="off"></textarea>
                <div class="inline-tools">
                    <button class="mini-tool-btn" id="voice-btn" title="长按语音输入">🎤</button>
                </div>
            </div>
            <div class="voice-status-tip" id="voice-tip">长按麦克风可说话转文字</div>

            <div class="action-grid">
                <button class="sketch-btn primary" onclick="checkAnswer()">提交 ✍️</button>
                <button class="sketch-btn" onclick="nextQuestion()">换题 🍃</button>
                <button class="sketch-btn" onclick="showAnswer()">答案 👀</button>
            </div>

            <!-- 卡片右下角：昵称与设置 -->
            <div class="card-footer-row">
                <div class="user-tag-bottom">
                    👤 <span id="user-display">本地游客</span>
                </div>
                <button class="login-mini-btn" onclick="openLoginModal()" id="login-btn-text">修改昵称</button>
            </div>
        </div>

        <div id="result-box"></div>
    </div>

    <!-- 底部常驻下载提醒条（当天第二次进入时显示） -->
    <div id="bottom-install-banner" class="bottom-install-banner">
        <div style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 1.4rem;">📱</span>
            <div style="font-size: 0.95rem; line-height: 1.3;">
                <div style="font-weight: 700;">添加到手机桌面</div>
                <div style="color: var(--text-muted); font-size: 0.85rem;">随时随地打卡，体验更丝滑</div>
            </div>
        </div>
        <div style="display: flex; gap: 4px;">
            <button class="sketch-btn primary" id="banner-install-btn" style="padding: 4px 10px; font-size: 0.95rem;">添加</button>
            <button class="sketch-btn" style="padding: 4px 8px; font-size: 0.95rem; background: #E5E7EB;" onclick="dismissBanner()">✕</button>
        </div>
    </div>

    <button class="surprise-btn" onclick="openSurpriseModal()">✨ 点击有惊喜</button>

    <!-- 当天第一次进入：弹窗提示下载 -->
    <div id="install-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <h3>✨ 添加到手机桌面</h3>
            <p style="font-size: 1.05rem; line-height: 1.5; color: var(--text-main); margin: 8px 0 16px 0;">
                随时随地打开打卡，<br>体验像原生 App 一样更丝滑！
            </p>
            <button class="sketch-btn primary" id="install-action-btn" style="width: 100%; margin-bottom: 8px;">立即添加</button>
            <button class="sketch-btn" style="width: 100%; background: #E5E7EB;" onclick="dismissInstallModal()">下次再说</button>
        </div>
    </div>

    <!-- 设置昵称弹窗 -->
    <div id="login-modal" class="modal-overlay">
        <div class="modal-card">
            <h3>个性昵称设置</h3>
            <p style="font-size: 0.95rem; color: var(--text-muted); text-align: center; margin: 0 0 6px 0; font-family: var(--font-handwriting);">输入你的专属昵称，开启英语手帐打卡之旅~</p>
            
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="例如：flower">

            <button class="sketch-btn primary" style="width: 100%; margin: 14px 0 6px 0;" onclick="saveNicknameLocally()">保存昵称</button>
            <button class="sketch-btn" style="width: 100%; background: #E5E7EB;" onclick="closeLoginModal()">取消</button>
        </div>
    </div>

    <div id="surprise-modal" class="modal-overlay">
        <div class="modal-card" style="text-align: center;">
            <p style="font-size: 1.2rem; line-height: 1.6; color: var(--text-main); margin: 8px 0 16px 0; font-family: var(--font-handwriting);">
                联系美丽且智慧的开发者<br>
                <span style="color: #2E7D32; font-size: 1.05rem; word-break: break-all; font-family: 'Quicksand', sans-serif;">zhaihuahua1701@gmail.com</span>
            </p>
            <button class="sketch-btn primary" style="width: 100%; margin-top: 8px;" onclick="closeSurpriseModal()">收下啦 ❤️</button>
        </div>
    </div>

    <script>
        let score = 10;
        let streak = 1; 
        let currentMode = 'word';

        const questionBanks = {
            word: [
                { category: "🔥 高频单词", chinese: "高效的、有成效的", english: "efficient", phonetic: "[ɪˈfɪʃnt]", hint: "Hint: e _ _ _ _ _ _ t (9 letters)" },
                { category: "🔥 高频单词", chinese: "灵感、启发", english: "inspiration", phonetic: "[ˌɪnspəˈreɪʃn]", hint: "Hint: i _ _ _ _ _ _ _ _ n (11 letters)" },
                { category: "🔥 高频单词", chinese: "优先事项、首要任务", english: "priority", phonetic: "[praɪˈɔːrəti]", hint: "Hint: p _ _ _ _ _ _ y (8 letters)" },
                { category: "🔥 高频单词", chinese: "灵活的、可变通的", english: "flexible", phonetic: "[ˈfleksəbl]", hint: "Hint: f _ _ _ _ _ _ e (8 letters)" },
                { category: "🔥 高频单词", chinese: "策略、战略", english: "strategy", phonetic: "[ˈstrætədʒi]", hint: "Hint: s _ _ _ _ _ _ y (8 letters)" },
                { category: "🔥 高频单词", chinese: "合作、协作", english: "collaboration", phonetic: "[kəˌlæbəˈreɪʃn]", hint: "Hint: c _ _ _ _ _ _ _ _ _ _ _ n (13 letters)" },
                { category: "🔥 高频单词", chinese: "成就、成绩", english: "achievement", phonetic: "[əˈtʃiːvmənt]", hint: "Hint: a _ _ _ _ _ _ _ _ _ t (11 letters)" },
                { category: "🔥 高频单词", chinese: "挑战、质疑", english: "challenge", phonetic: "[ˈtʃælɪndʒ]", hint: "Hint: c _ _ _ _ _ _ _ e (9 letters)" }
            ],
            phrase: [
                { category: "✈️ 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "Hint: Where is the boarding gate..." },
                { category: "🧳 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "Hint: air conditioner / switch rooms" },
                { category: "🍜 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "Hint: contain peanuts / allergic" },
                { category: "🚕 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "Hint: subway station / nearby" },
                { category: "💼 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "Hint: Can everyone hear me? / microphone" },
                { category: "💼 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "Hint: Regarding this project / thoughts" },
                { category: "💼 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "Hint: Sorry to interrupt / quick question" },
                { category: "💼 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "Hint: ahead of schedule / expect to" },
                { category: "💼 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "Hint: plate is full / might not have time" }
            ]
        };

        let currentIndex = 0;
        let deferredPrompt;

        // PWA 安装事件拦截
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            handleInstallPromptLogic();
        });

        function handleInstallPromptLogic() {
            const todayStr = new Date().toDateString();
            const lastPromptDate = localStorage.getItem('ee_last_prompt_date');
            const dismissedBanner = localStorage.getItem('ee_banner_dismissed_date');

            // 如果今天还没有弹过窗，则弹出弹窗提醒下载
            if (lastPromptDate !== todayStr) {
                document.getElementById('install-modal').style.display = 'flex';
                localStorage.setItem('ee_last_prompt_date', todayStr);
            } else {
                // 如果当天已经弹过窗了，且用户没在底部点过叉子，则在最底下展示横幅
                if (dismissedBanner !== todayStr) {
                    document.getElementById('bottom-install-banner').style.display = 'flex';
                }
            }
        }

        // 如果没有触发beforeinstallprompt事件（例如某些浏览器环境），做个兼容兜底逻辑
        window.addEventListener('DOMContentLoaded', () => {
            const todayStr = new Date().toDateString();
            const lastPromptDate = localStorage.getItem('ee_last_prompt_date');
            if (lastPromptDate !== todayStr) {
                // 模拟首进弹出
                setTimeout(() => {
                    if (!document.getElementById('install-modal').style.display || document.getElementById('install-modal').style.display === 'none') {
                        // 仅当没被系统事件抢先时触发
                    }
                }, 500);
            } else {
                if (localStorage.getItem('ee_banner_dismissed_date') !== todayStr) {
                    document.getElementById('bottom-install-banner').style.display = 'flex';
                }
            }

            const localName = localStorage.getItem('ee_nickname');
            const localScore = localStorage.getItem('ee_score');
            const localStreak = localStorage.getItem('ee_streak');
            if (localName) {
                document.getElementById('user-display').innerText = localName;
                document.getElementById('login-btn-text').innerText = '修改昵称';
            }
            if (localScore) score = parseInt(localScore);
            if (localStreak) streak = parseInt(localStreak);
            
            checkDailyCheckIn();
            updateStatsUI();
            initSpeechRecognition();
            loadQuestion();
        });

        async function triggerInstallAction() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('install-modal').style.display = 'none';
                document.getElementById('bottom-install-banner').style.display = 'none';
            } else {
                alert('提示：你可以点击手机浏览器菜单（如Safari的“分享”或Chrome的“...”），然后选择“添加到主屏幕”即可！');
                document.getElementById('install-modal').style.display = 'none';
                document.getElementById('bottom-install-banner').style.display = 'none';
            }
        }

        document.getElementById('install-action-btn').addEventListener('click', triggerInstallAction);
        document.getElementById('banner-install-btn').addEventListener('click', triggerInstallAction);

        function dismissInstallModal() {
            document.getElementById('install-modal').style.display = 'none';
            // 弹窗关闭后，在当天再次进入/关闭时，让底栏显示出来
            const todayStr = new Date().toDateString();
            if (localStorage.getItem('ee_banner_dismissed_date') !== todayStr) {
                document.getElementById('bottom-install-banner').style.display = 'flex';
            }
        }

        function dismissBanner() {
            document.getElementById('bottom-install-banner').style.display = 'none';
            const todayStr = new Date().toDateString();
            localStorage.setItem('ee_banner_dismissed_date', todayStr);
        }

        function checkDailyCheckIn() {
            const todayStr = new Date().toDateString();
            const lastCheckInDate = localStorage.getItem('ee_last_checkin_date');

            if (lastCheckInDate !== todayStr) {
                streak += 1;
                localStorage.setItem('ee_last_checkin_date', todayStr);
                localStorage.setItem('ee_streak', streak);
            }
        }

        function updateStatsUI() {
            document.getElementById('score').innerText = score;
            document.getElementById('streak').innerText = streak;
        }

        function switchMode(mode) {
            currentMode = mode;
            document.getElementById('tab-word').className = mode === 'word' ? 'mode-tab active' : 'mode-tab';
            document.getElementById('tab-phrase').className = mode === 'phrase' ? 'mode-tab active' : 'mode-tab';
            loadQuestion();
        }

        function openLoginModal() { 
            const currentName = document.getElementById('user-display').innerText;
            if (currentName !== '本地游客') {
                document.getElementById('reg-nickname').value = currentName;
            }
            document.getElementById('login-modal').style.display = 'flex'; 
        }
        function closeLoginModal() { document.getElementById('login-modal').style.display = 'none'; }

        function openSurpriseModal() { document.getElementById('surprise-modal').style.display = 'flex'; }
        function closeSurpriseModal() { document.getElementById('surprise-modal').style.display = 'none'; }

        function saveNicknameLocally() {
            const nickname = document.getElementById('reg-nickname').value.trim() || "手帐练习生";
            document.getElementById('user-display').innerText = nickname;
            document.getElementById('login-btn-text').innerText = '修改昵称';
            localStorage.setItem('ee_nickname', nickname);
            alert('✨ 昵称保存成功！开始开心打卡吧~');
            closeLoginModal();
        }

        function loadQuestion() {
            const list = questionBanks[currentMode];
            currentIndex = Math.floor(Math.random() * list.length);
            const q = list[currentIndex];
            document.getElementById("category-pill").innerText = q.category;
            document.getElementById("chinese-text").innerText = q.chinese;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            const resultBox = document.getElementById("result-box");
            resultBox.innerHTML = "";
            resultBox.className = "";
        }

        function checkAnswer() {
            const list = questionBanks[currentMode];
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = list[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultBox = document.getElementById("result-box");

            if (!cleanUser) {
                resultBox.className = "feedback-error";
                resultBox.innerHTML = `<span style="font-size: 1.05rem;">⚠️ 请先输入或说出英文回答</span>`;
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length >= 3 && cleanTarget.includes(cleanUser))) {
                score += 10;
                resultBox.className = "feedback-success";
                resultBox.innerHTML = `✨ 回答完美！积分 +10`;
                setTimeout(nextQuestion, 1500);
            } else {
                resultBox.className = "feedback-error";
                let displayContent = list[currentIndex].english;
                if (currentMode === 'word' && list[currentIndex].phonetic) {
                    displayContent += ` <span style="font-size: 0.95rem; color: var(--text-muted); font-family: 'Quicksand', sans-serif;">${list[currentIndex].phonetic}</span>`;
                }
                resultBox.innerHTML = `<span style="font-family: 'Quicksand', sans-serif; font-size: 1.05rem;">💡 ${displayContent}</span>
                                      <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(list[currentIndex].english)}')">🔊 朗读</button>`;
            }
            updateStatsUI();
            localStorage.setItem('ee_score', score);
        }

        function showAnswer() {
            const list = questionBanks[currentMode];
            const resultBox = document.getElementById("result-box");
            resultBox.className = "feedback-error";
            let displayContent = list[currentIndex].english;
            if (currentMode === 'word' && list[currentIndex].phonetic) {
                displayContent += ` <span style="font-size: 0.95rem; color: var(--text-muted); font-family: 'Quicksand', sans-serif;">${list[currentIndex].phonetic}</span>`;
            }
            resultBox.innerHTML = `<span style="font-family: 'Quicksand', sans-serif; font-size: 1.05rem;">💡 ${displayContent}</span>
                                  <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(list[currentIndex].english)}')">🔊 朗读</button>`;
            updateStatsUI();
            localStorage.setItem('ee_score', score);
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const decodedText = decodeURIComponent(text);
            const utterance = new SpeechSynthesisUtterance(decodedText);
            utterance.lang = 'en-US';
            const voices = window.speechSynthesis.getVoices();
            const standardVoice = voices.find(v => v.lang === 'en-US' && (v.name.includes('Google') || v.name.includes('Natural') || v.name.includes('Samantha') || v.name.includes('US English'))) || voices.find(v => v.lang.startsWith('en'));
            if (standardVoice) utterance.voice = standardVoice;
            utterance.rate = 1.0;
            utterance.pitch = 1.0;
            window.speechSynthesis.speak(utterance);
        }

        function nextQuestion() {
            loadQuestion();
        }

        function initSpeechRecognition() {
            const btn = document.getElementById('voice-btn');
            const tip = document.getElementById('voice-tip');
            const inputArea = document.getElementById('user-input');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                tip.innerText = "浏览器不支持语音识别";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isHolding = false;

            const startRecording = (e) => {
                e.preventDefault();
                if (isHolding) return;
                isHolding = true;
                btn.classList.add('recording');
                tip.innerText = "正在聆听，请说话...";
                try { recognition.start(); } catch(err) { console.log(err); }
            };

            const stopRecording = (e) => {
                e.preventDefault();
                if (!isHolding) return;
                isHolding = false;
                btn.classList.remove('recording');
                tip.innerText = "正在识别中...";
                try { recognition.stop(); } catch(err) { console.log(err); }
            };

            btn.addEventListener('mousedown', startRecording);
            btn.addEventListener('mouseup', stopRecording);
            btn.addEventListener('mouseleave', stopRecording);
            btn.addEventListener('touchstart', startRecording);
            btn.addEventListener('touchend', stopRecording);

            recognition.onresult = (event) => {
                inputArea.value = event.results[0][0].transcript;
                tip.innerText = "识别成功！点击提交查看";
            };

            recognition.onerror = () => {
                tip.innerText = "识别出错，请重试";
                btn.classList.remove('recording');
                isHolding = false;
            };

            recognition.onend = () => {
                btn.classList.remove('recording');
                isHolding = false;
                if(tip.innerText === "正在聆听，请说话...") {
                    tip.innerText = "长按麦克风可说话转文字";
                }
            };
        }
    </script>
</body>
</html>
