<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy English - 每天3分钟，让英语悄悄长出来</title>
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #fdfbf7;
            color: #2c3e50;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border: 3px solid #2c3e50;
            border-radius: 24px;
            box-shadow: 6px 6px 0px #2c3e50;
            padding: 30px 24px;
            position: relative;
        }

        /* 顶部状态栏 */
        .top-bar {
            position: absolute;
            top: -55px;
            right: 0;
            display: flex;
            gap: 10px;
        }

        .badge-btn {
            background: #ffffff;
            border: 2px solid #2c3e50;
            padding: 6px 12px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: bold;
            box-shadow: 3px 3px 0px #2c3e50;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 4px;
            text-decoration: none;
            color: #2c3e50;
        }

        .logo-area {
            font-size: 32px;
            font-weight: 800;
            margin-bottom: 25px;
            display: flex;
            align-items: baseline;
            gap: 8px;
        }

        .logo-area span {
            color: #3b82f6;
        }

        .slogan {
            text-align: center;
            font-size: 15px;
            color: #64748b;
            margin-bottom: 20px;
        }

        /* 标签页切换 */
        .tabs {
            display: flex;
            border: 2px solid #2c3e50;
            border-radius: 14px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #f1f5f9;
        }

        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            background: transparent;
            border: none;
            transition: all 0.2s;
        }

        .tab.active {
            background: #ffffff;
            color: #2563eb;
            box-shadow: 0 2px 0 rgba(0,0,0,0.05);
        }

        /* 分类标签显示 */
        .category-tag {
            display: inline-block;
            background: #fef08a;
            border: 2px solid #2c3e50;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 15px;
            box-shadow: 2px 2px 0px #2c3e50;
        }

        /* 题目展示区 */
        .question-box {
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            margin-bottom: 25px;
            min-height: 70px;
            display: flex;
            align-items: center;
        }

        /* 输入框区域 */
        .input-container {
            position: relative;
            margin-bottom: 25px;
        }

        textarea {
            width: 100%;
            height: 90px;
            border: 2px solid #2c3e50;
            border-radius: 14px;
            padding: 14px;
            font-size: 15px;
            resize: none;
            outline: none;
            background: #fafaf9;
            box-shadow: inset 2px 2px 0px rgba(0,0,0,0.03);
        }

        textarea:focus {
            border-color: #3b82f6;
            background: #ffffff;
        }

        .mic-btn {
            position: absolute;
            right: 12px;
            bottom: 15px;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            padding: 4px;
        }

        /* 底部操作按钮 */
        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            padding: 12px 0;
            border: 2px solid #2c3e50;
            border-radius: 14px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #2c3e50;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #2c3e50;
        }

        .btn-submit { background: #fbcfe8; color: #9d174d; }
        .btn-next { background: #fef08a; color: #854d0e; }
        .btn-answer { background: #e0f2fe; color: #0369a1; }

        /* 反馈与答案弹层样式 */
        .feedback {
            margin-top: 15px;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            display: none;
        }
        .feedback.success { background: #dcfce7; color: #166534; border: 2px solid #2c3e50; }
        .feedback.error { background: #fee2e2; color: #991b1b; border: 2px solid #2c3e50; }

        /* 底部辅助栏 */
        .footer-nav {
            width: 100%;
            max-width: 440px;
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 顶部状态栏 -->
        <div class="top-bar">
            <div class="badge-btn" id="streakBadge">🔥 连续打卡 <span id="streakCount">120</span></div>
            <button class="badge-btn" onclick="alert('请在浏览器菜单中选择「添加到主屏幕」')">📱 下载App</button>
        </div>

        <!-- Logo -->
        <div class="logo-area">
            Easy <span>English</span>
        </div>

        <div class="slogan">每天3分钟，让英语悄悄长出来 🌱</div>

        <!-- 词库切换标签 -->
        <div class="tabs">
            <button class="tab active" id="tabWord" onclick="switchType('word')">🔤 单词库</button>
            <button class="tab" id="tabPhrase" onclick="switchType('phrase')">💬 短语库</button>
        </div>

        <!-- 分类显示 -->
        <div class="category-tag" id="categoryLabel">✈️加载中...</div>

        <!-- 题目区域 -->
        <div class="question-box" id="questionText">正在连接题库...</div>

        <!-- 输入框 -->
        <div class="input-container">
            <textarea id="userInput" placeholder="输入英文..."></textarea>
            <button class="mic-btn" id="micBtn" title="语音输入">🎤</button>
        </div>

        <!-- 按钮组 -->
        <div class="actions">
            <button class="btn btn-submit" onclick="checkAnswer()">✍️提交</button>
            <button class="btn btn-next" onclick="next()">🌿换题</button>
            <button class="btn btn-answer" onclick="showAnswer()">👀答案</button>
        </div>

        <!-- 结果反馈 -->
        <div id="feedbackBox" class="feedback"></div>
    </div>

    <!-- 底部功能区 -->
    <div class="footer-nav">
        <button class="badge-btn" onclick="alert('✨ 提示：输入时支持直接联想或语音输入，坚持每天打卡哦！')">✨ 点击有惊喜</button>
        <button class="badge-btn" onclick="alert('当前用户: flower (zhaihuahua1701@gmail.com)')">👤 flower</button>
    </div>

    <script>
        // ==========================
        // 1. Supabase 配置 (已自动填入)
        // ==========================
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co'; 
        const SUPABASE_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentType = 'word'; // 'word' 或 'phrase'
        let questionPool = [];    // 当前题库数据
        let current = null;       // 当前题目对象
        let lastQuestionId = null;// 上一题ID，避免连续重复

        // 初始化加载
        window.onload = async function() {
            await loadQuestions();
        };

        // 切换单词/短语标签
        async function switchType(type) {
            currentType = type;
            document.getElementById('tabWord').classList.toggle('active', type === 'word');
            document.getElementById('tabPhrase').classList.toggle('active', type === 'phrase');
            await loadQuestions();
        }

        // 从 Supabase 加载对应分类的所有题目
        async function loadQuestions() {
            document.getElementById('questionText').innerText = '加载中...';
            const { data, error } = await _supabase
                .from('questions')
                .select('*')
                .eq('type', currentType);

            if (error) {
                console.error('加载失败:', error);
                document.getElementById('questionText').innerText = '加载失败，请检查Supabase连接配置';
                return;
            }

            questionPool = data || [];
            if (questionPool.length > 0) {
                next();
            } else {
                document.getElementById('questionText').innerText = '当前题库暂无题目';
                document.getElementById('categoryLabel').innerText = '提示';
            }
        }

        // 🎯 核心：纯随机抽题引擎（确保连续两道题不重复，且无任何奇怪修饰词）
        function next() {
            if (questionPool.length === 0) return;

            let availablePool = questionPool;
            if (lastQuestionId !== null && questionPool.length > 1) {
                availablePool = questionPool.filter(q => q.id !== lastQuestionId);
            }

            let randomIndex = Math.floor(Math.random() * availablePool.length);
            current = availablePool[randomIndex];
            lastQuestionId = current.id;

            render();
        }

        // 渲染当前题目到页面
        function render() {
            document.getElementById('categoryLabel').innerText = current.category;
            document.getElementById('questionText').innerText = current.question;
            document.getElementById('userInput').value = '';
            document.getElementById('feedbackBox').style.display = 'none';
        }

        // 检查答案
        function checkAnswer() {
            if (!current) return;
            const userVal = document.getElementById('userInput').value.trim().toLowerCase();
            const correctVal = current.answer.trim().toLowerCase();
            
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = 'block';

            // 简单模糊匹配（忽略标点和大小写差异）
            const cleanUser = userVal.replace(/[^a-z0-9]/g, '');
            const cleanCorrect = correctVal.replace(/[^a-z0-9]/g, '');

            if (cleanUser === cleanCorrect || cleanUser.includes(cleanCorrect)) {
                feedbackBox.className = 'feedback success';
                feedbackBox.innerHTML = '🎉 回答正确！太棒了！';
            } else {
                feedbackBox.className = 'feedback error';
                feedbackBox.innerHTML = `❌ 再想想哦~ 正确答案是: <b>${current.answer}</b>`;
            }
        }

        // 查看答案
        function showAnswer() {
            if (!current) return;
            const feedbackBox = document.getElementById('feedbackBox');
            feedbackBox.style.display = 'block';
            feedbackBox.className = 'feedback error';
            feedbackBox.innerHTML = `💡 正确答案: <b>${current.answer}</b> ${current.phonetic ? '(' + current.phonetic + ')' : ''}`;
        }

        // 语音输入模拟（浏览器原生 Web Speech API）
        const micBtn = document.getElementById('micBtn');
        micBtn.onclick = function() {
            if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
                alert('您的浏览器不支持语音识别功能，请直接手动输入。');
                return;
            }
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.onstart = function() { micBtn.style.color = '#3b82f6'; };
            recognition.onresult = function(event) {
                document.getElementById('userInput').value = event.results[0][0].transcript;
                micBtn.style.color = '#2c3e50';
            };
            recognition.onerror = function() { micBtn.style.color = '#2c3e50'; };
            recognition.onend = function() { micBtn.style.color = '#2c3e50'; };
            recognition.start();
        };
    </script>
</body>
</html>
