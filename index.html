<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>✦ Easy English ✦</title>
    <!-- 引入艺术字体与手写可爱字体 -->
    <link href="https://fonts.googleapis.com/css2?family=Architects+Daughter&family=Long+Cang&family=Noto+Serif+SC:wght@500;700&display=swap" rel="stylesheet">
    <!-- 引入 Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #FAF6ED;
            --card-bg: #FFFFFF;
            --border-dark: #2C2A29;
            --accent-terracotta: #E07A5F;
            --text-main: #2C2A29;
            --text-muted: #7E766D;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            font-family: 'Noto Serif SC', -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 16px 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: var(--card-bg);
            border-radius: 32px 24px 28px 26px;
            border: 2.5px solid var(--border-dark);
            padding: 20px 16px;
            box-shadow: 6px 8px 0px rgba(44, 42, 41, 0.85);
            position: relative;
        }

        .header {
            text-align: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-family: 'Architects Daughter', cursive, serif;
            font-size: 2.2rem;
            font-weight: bold;
            letter-spacing: 1px;
            margin: 0;
            color: var(--text-main);
            text-shadow: 2px 2px 0px #FFE5EC;
        }

        /* 顶部信息面板 */
        .top-info-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            background: #FFF1F2;
            padding: 10px 14px;
            border-radius: 16px;
            border: 2.5px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--border-dark);
        }

        .user-section {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .user-info-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            font-weight: bold;
        }

        .user-tag span {
            color: var(--accent-terracotta);
        }

        .login-mini-btn {
            background: #FFE5EC;
            color: var(--border-dark);
            border: 1.5px solid var(--border-dark);
            padding: 1px 8px;
            border-radius: 8px;
            font-size: 0.68rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 1px 1px 0px var(--border-dark);
        }
        .login-mini-btn:active {
            transform: translate(1px, 1px);
            box-shadow: none;
        }

        .stats-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
            font-weight: 700;
            font-size: 0.82rem;
        }

        .stat-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* 核心手帐卡片 */
        .sketch-card {
            background: #FFFCF7;
            border: 2.5px dashed #E6DEC9;
            border-radius: 20px;
            padding: 16px 14px;
            text-align: center;
            margin-bottom: 12px;
            position: relative;
        }

        .category-pill {
            display: inline-block;
            background: #E8F5E9;
            color: #2E7D32;
            border: 2px solid var(--border-dark);
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            margin-bottom: 10px;
            box-shadow: 2px 2px 0px var(--border-dark);
        }

        .chinese-prompt {
            font-size: 1.15rem;
            font-weight: 700;
            line-height: 1.4;
            margin-bottom: 6px;
        }

        .hint-text {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            font-family: 'Architects Daughter', cursive, monospace;
        }

        .input-container-wrapper {
            position: relative;
            margin-bottom: 10px;
        }

        textarea {
            width: 100%;
            height: 72px;
            padding: 10px 42px 10px 12px;
            font-size: 0.95rem;
            font-family: 'Architects Daughter', cursive, sans-serif;
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            background: #FFFFFF;
            resize: none;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            user-select: text;
        }

        textarea:focus {
            border-color: var(--accent-terracotta);
            box-shadow: 0 0 0 3px rgba(224, 122, 95, 0.15), inset 0 2px 4px rgba(0,0,0,0.02);
        }

        .inline-tools {
            position: absolute;
            right: 8px;
            bottom: 10px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .mini-tool-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 2px solid var(--border-dark);
            background: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 0.85rem;
            box-shadow: 1px 1px 0px var(--border-dark);
            transition: all 0.08s ease;
        }

        .mini-tool-btn:active, .mini-tool-btn.recording {
            transform: translate(1px, 1px);
            box-shadow: none;
            background: #FF8FA3;
            color: white;
        }

        .voice-status-tip {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-family: 'Architects Daughter', cursive;
            margin-bottom: 10px;
            height: 14px;
        }

        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .sketch-btn {
            font-family: inherit;
            font-weight: 700;
            font-size: 0.88rem;
            padding: 10px;
            border: 2.5px solid var(--border-dark);
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 2.5px 2.5px 0px var(--border-dark);
            transition: all 0.08s ease;
            background: #FFFFFF;
            color: var(--text-main);
        }

        .sketch-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }

        .sketch-btn.primary {
            background: #2C2A29;
            color: #FFFFFF;
        }

        .sketch-btn.full {
            grid-column: span 2;
        }

        #result-box {
            margin-top: 10px;
            font-size: 0.92rem;
            font-family: 'Architects Daughter', cursive, sans-serif;
            font-weight: bold;
            min-height: 44px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 12px;
            padding: 8px 12px;
            text-align: left;
            border: 2.5px solid var(--border-dark);
            box-shadow: 3px 3px 0px var(--border-dark);
            gap: 8px;
        }

        .feedback-success { background: #E8F5E9; color: #2E7D32; }
        .feedback-error { background: #FFEBEE; color: #C62828; }

        .answer-audio-btn {
            background: #FFF;
            border: 2px solid var(--border-dark);
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 0.8rem;
            cursor: pointer;
            box-shadow: 2px 2px 0px var(--border-dark);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .answer-audio-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-dark);
            background: #FFE5EC;
        }

        #login-modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(44, 42, 41, 0.65);
            backdrop-filter: blur(4px);
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal-card {
            background: #FFFCF7;
            border: 2.5px solid var(--border-dark);
            border-radius: 24px;
            padding: 20px;
            width: 90%;
            max-width: 340px;
            box-shadow: 6px 8px 0px var(--border-dark);
            text-align: left;
        }

        .modal-card h3 {
            margin: 0 0 4px 0;
            font-family: 'Long Cang', cursive;
            font-size: 1.8rem;
            text-align: center;
        }

        .modal-card label {
            display: block;
            font-size: 0.72rem;
            font-weight: bold;
            color: var(--text-muted);
            margin-top: 8px;
        }

        .modal-card input {
            width: 100%;
            padding: 8px 10px;
            margin-top: 2px;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            font-family: inherit;
            font-size: 0.88rem;
            outline: none;
            background: #FFF;
        }

        .verify-row {
            display: flex;
            gap: 8px;
            margin-top: 2px;
        }
        .verify-row input { margin-top: 0; }

        .verify-btn {
            background: #FFE5EC;
            border: 2px solid var(--border-dark);
            border-radius: 10px;
            padding: 0 10px;
            font-size: 0.72rem;
            font-weight: bold;
            cursor: pointer;
            white-space: nowrap;
            box-shadow: 2px 2px 0px var(--border-dark);
        }
        .verify-btn:active {
            transform: translate(1px, 1px);
            box-shadow: 1px 1px 0px var(--border-dark);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <div class="brand-title">Easy English</div>
        </div>

        <!-- 顶部信息面板 -->
        <div class="top-info-panel">
            <div class="user-section">
                <div class="user-info-row">
                    <span class="user-tag">👤 <span id="user-display">本地游客</span></span>
                </div>
                <button class="login-mini-btn" onclick="openModal()" id="login-btn-text">点击云端绑定</button>
            </div>
            <div class="stats-group">
                <div class="stat-item">🔥 连续打卡: <span id="streak">0</span> 天</div>
                <div class="stat-item">⭐ 学习积分: <span id="score">0</span> 分</div>
            </div>
        </div>

        <div class="sketch-card">
            <div id="category-pill" class="category-pill">✈️ 载入中...</div>
            <div class="chinese-prompt" id="chinese-text">正在翻阅手帐页面...</div>
            <div class="hint-text" id="hint-text"></div>
            
            <div class="input-container-wrapper">
                <textarea id="user-input" placeholder="请在此写下你的英文表达..." autocomplete="off"></textarea>
                <div class="inline-tools">
                    <button class="mini-tool-btn" id="voice-btn" title="长按语音输入">🎤</button>
                    <button class="mini-tool-btn" onclick="clearInput()" title="清空内容">🧹</button>
                </div>
            </div>
            <div class="voice-status-tip" id="voice-tip">长按麦克风可说话转文字</div>

            <div class="action-grid">
                <button class="sketch-btn primary" onclick="checkAnswer()">提交回答 ✍️</button>
                <button class="sketch-btn" onclick="nextQuestion()">换一题 🍃</button>
                <button class="sketch-btn full" onclick="showAnswer()">偷看参考答案 👀</button>
            </div>
        </div>

        <div id="result-box"></div>
    </div>

    <!-- 登录/绑定弹窗 -->
    <div id="login-modal">
        <div class="modal-card">
            <h3>云端账号同步</h3>
            <p style="font-size: 0.7rem; color: var(--text-muted); text-align: center; margin: 0 0 6px 0;">输入常用电子邮箱接收验证码</p>
            
            <label>昵称</label>
            <input type="text" id="reg-nickname" placeholder="例如：手帐达人 / 杰克">

            <label>电子邮箱</label>
            <input type="email" id="reg-account" placeholder="请输入常用邮箱（如 QQ/163/Gmail）">

            <label>验证码</label>
            <div class="verify-row">
                <input type="text" id="reg-code" placeholder="输入邮箱收到的验证码">
                <button class="verify-btn" onclick="sendVerifyCode()">获取验证码</button>
            </div>

            <button class="sketch-btn primary" style="width: 100%; margin: 14px 0 6px 0;" onclick="handleAuthSubmit()">完成绑定 / 登录</button>
            <button class="sketch-btn" style="width: 100%; background: #E5E7EB;" onclick="closeModal()">取消</button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://hrgzmwtgpacdxifcevwy.supabase.co';
        const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_4XcXlLh77BtvmIajOGbpPA_T7d6b9fu';
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

        let currentUser = null;
        let score = 0;
        let streak = 0;

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await _supabase.auth.getSession();
            if (session) {
                currentUser = session.user;
                await fetchUserData();
            }
            initSpeechRecognition();
            if ('speechSynthesis' in window) {
                window.speechSynthesis.getVoices();
            }
        });

        function openModal() { document.getElementById('login-modal').style.display = 'flex'; }
        function closeModal() { document.getElementById('login-modal').style.display = 'none'; }

        // 发送真实邮箱验证码
        async function sendVerifyCode() {
            const account = document.getElementById('reg-account').value.trim();
            if (!account || !account.includes('@')) {
                alert('请输入合法的电子邮箱地址！');
                return;
            }

            const { error } = await _supabase.auth.signInWithOtp({
                email: account,
                options: { shouldCreateUser: true }
            });

            if (error) {
                alert('验证码发送失败: ' + error.message);
            } else {
                alert('✅ 验证码已发送至您的邮箱，请前往查收！');
            }
        }

        // 验证验证码并登录/绑定
        async function handleAuthSubmit() {
            const nickname = document.getElementById('reg-nickname').value.trim() || "手帐练习生";
            const account = document.getElementById('reg-account').value.trim();
            const token = document.getElementById('reg-code').value.trim();

            if (!account || !token) {
                alert('请输入邮箱和收到的验证码！');
                return;
            }

            const { data, error } = await _supabase.auth.verifyOtp({
                email: account,
                token: token,
                type: 'email'
            });

            if (error) {
                alert('验证失败，请检查验证码是否正确: ' + error.message);
                return;
            }

            currentUser = data.user;
            alert('🎉 登录/绑定成功！');

            if (currentUser) {
                await _supabase.from('user_profiles').upsert({
                    id: currentUser.id,
                    nickname: nickname,
                    updated_at: new Date()
                });
            }

            closeModal();
            window.location.reload();
        }

        async function fetchUserData() {
            if (!currentUser) return;
            const { data } = await _supabase
                .from('user_profiles')
                .select('nickname, score, streak')
                .eq('id', currentUser.id)
                .single();
            
            if (data) {
                score = data.score || 0;
                streak = data.streak || 0;
                document.getElementById('user-display').innerText = data.nickname || "已绑定用户";
                document.getElementById('login-btn-text').innerText = '已同步云端';
                updateStatsUI();
            }
        }

        async function syncUserDataToCloud() {
            if (!currentUser) return;
            await _supabase
                .from('user_profiles')
                .update({ score: score, streak: streak, updated_at: new Date() })
                .eq('id', currentUser.id);
        }

        const questions = [
            { category: "✈️ 机场海关", chinese: "请问飞往伦敦的航班在哪登机？", english: "Where is the boarding gate for London?", hint: "Hint: Where is the boarding gate..." },
            { category: "🧳 酒店入住", chinese: "不好意思，我的房间空调坏了，能帮我换一间吗？", english: "Excuse me, the air conditioner in my room is broken. Can I switch rooms?", hint: "Hint: air conditioner / switch rooms" },
            { category: "🍜 餐厅点餐", chinese: "这个里面有花生吗？我对花生过敏。", english: "Does this contain peanuts? I'm allergic to peanuts.", hint: "Hint: contain peanuts / allergic" },
            { category: "🚕 城市问路", chinese: "请问附近有地铁站吗？", english: "Excuse me, is there a subway station nearby?", hint: "Hint: subway station / nearby" },
            { category: "💼 远程会议", chinese: "大家能听到我说话吗？我的麦克风刚才有点问题。", english: "Can everyone hear me? My microphone was acting up a bit.", hint: "Hint: Can everyone hear me? / microphone" },
            { category: "💼 表达观点", chinese: "关于这个项目，我想听听大家的看法。", english: "Regarding this project, I'd love to hear everyone's thoughts.", hint: "Hint: Regarding this project / thoughts" },
            { category: "💼 礼貌打断", chinese: "不好意思打断一下，我有一个小问题。", english: "Sorry to interrupt, but I have a quick question.", hint: "Hint: Sorry to interrupt / quick question" },
            { category: "💼 进度汇报", chinese: "我们目前进度超前，预计明天能完成。", english: "We are currently ahead of schedule and expect to finish tomorrow.", hint: "Hint: ahead of schedule / expect to" },
            { category: "💼 职场拒绝", chinese: "我现在手头有点满，这周可能腾不出时间。", english: "My plate is a bit full right now, I might not have time this week.", hint: "Hint: plate is full / might not have time" }
        ];

        let currentIndex = 0;

        function loadQuestion() {
            currentIndex = Math.floor(Math.random() * questions.length);
            const q = questions[currentIndex];
            document.getElementById("category-pill").innerText = q.category;
            document.getElementById("chinese-text").innerHTML = `“${q.chinese}”`;
            document.getElementById("hint-text").innerText = q.hint;
            document.getElementById("user-input").value = "";
            const resultBox = document.getElementById("result-box");
            resultBox.innerHTML = "";
            resultBox.className = "";
        }

        function checkAnswer() {
            const userVal = document.getElementById("user-input").value.trim().toLowerCase();
            const cleanUser = userVal.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const target = questions[currentIndex].english.toLowerCase();
            const cleanTarget = target.replace(/[.,\/#!$%\^&\*;:{}=\-_`~()]/g,"").replace(/\s+/g," ");
            const resultBox = document.getElementById("result-box");

            if (!cleanUser) {
                resultBox.className = "feedback-error";
                resultBox.innerText = "⚠️ 请先写下或说出你的英文回答哦";
                return;
            }

            if (cleanUser === cleanTarget || (cleanUser.length > 5 && cleanTarget.includes(cleanUser))) {
                score += 10;
                streak += 1;
                resultBox.className = "feedback-success";
                resultBox.innerHTML = `<span>✨ 回答完美！连击 +1</span>`;
                setTimeout(nextQuestion, 1500);
            } else {
                streak = 0;
                resultBox.className = "feedback-error";
                resultBox.innerHTML = `<span>💡 答案：${questions[currentIndex].english}</span>
                                      <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(questions[currentIndex].english)}')">🔊 听朗读</button>`;
            }
            updateStatsUI();
            syncUserDataToCloud();
        }

        function showAnswer() {
            const resultBox = document.getElementById("result-box");
            resultBox.className = "feedback-error";
            resultBox.innerHTML = `<span>💡 答案：${questions[currentIndex].english}</span>
                                  <button class="answer-audio-btn" onclick="playAudio('${encodeURIComponent(questions[currentIndex].english)}')">🔊 听朗读</button>`;
            streak = 0;
            updateStatsUI();
            syncUserDataToCloud();
        }

        function playAudio(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const decodedText = decodeURIComponent(text);
            const utterance = new SpeechSynthesisUtterance(decodedText);
            utterance.lang = 'en-US';
            utterance.rate = 0.92;
            utterance.pitch = 1.0;

            const voices = window.speechSynthesis.getVoices();
            const preferredVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('Samantha') || v.name.includes('Siri') || v.name.includes('Jenny'))) || voices.find(v => v.lang.startsWith('en'));
            if (preferredVoice) utterance.voice = preferredVoice;

            window.speechSynthesis.speak(utterance);
        }

        function nextQuestion() {
            loadQuestion();
        }

        function clearInput() {
            document.getElementById("user-input").value = "";
            document.getElementById("user-input").focus();
        }

        function initSpeechRecognition() {
            const btn = document.getElementById('voice-btn');
            const tip = document.getElementById('voice-tip');
            const inputArea = document.getElementById('user-input');

            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                tip.innerText = "浏览器不支持语音识别";
                return;
            }

            const recognition = new SpeechRecognition();
            recognition.lang = 'en-US';
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;

            let isHolding = false;

            const startRecording = (e) => {
                e.preventDefault();
                if (isHolding) return;
                isHolding = true;
                btn.classList.add('recording');
                tip.innerText = "正在聆听，请说话...";
                try { recognition.start(); } catch (err) {}
            };

            const stopRecording = (e) => {
                e.preventDefault();
                if (!isHolding) return;
                isHolding = false;
                btn.classList.remove('recording');
                tip.innerText = "长按麦克风可说话转文字";
                try { recognition.stop(); } catch (err) {}
            };

            recognition.onresult = (event) => {
                inputArea.value = event.results[0][0].transcript;
                tip.innerText = "转换成功！";
                setTimeout(() => { tip.innerText = "长按麦克风可说话转文字"; }, 1500);
            };

            recognition.onerror = () => {
                btn.classList.remove('recording');
                tip.innerText = "识别失败，请重试";
                setTimeout(() => { tip.innerText = "长按麦克风可说话转文字"; }, 1500);
            };

            recognition.onend = () => {
                btn.classList.remove('recording');
            };

            btn.addEventListener('mousedown', startRecording);
            btn.addEventListener('mouseup', stopRecording);
            btn.addEventListener('mouseleave', stopRecording);

            btn.addEventListener('touchstart', startRecording, {passive: false});
            btn.addEventListener('touchend', stopRecording, {passive: false});
        }

        function updateStatsUI() {
            document.getElementById("score").innerText = score;
            document.getElementById("streak").innerText = streak;
        }

        loadQuestion();
    </script>
</body>
</html>
